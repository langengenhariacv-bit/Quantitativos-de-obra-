plugins {
    id 'com.android.application'
}

android {
    namespace 'br.lang.controletv'
    compileSdk 35

    defaultConfig {
        applicationId 'br.lang.controletv'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Alinha as versões do Kotlin trazidas pelo OkHttp/Okio (evita classes duplicadas).
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.9.24')
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
