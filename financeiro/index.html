<style>
:root{--bg:#f3f0eb;--card:#fffdfa;--ink:#171717;--muted:#6f6b66;--line:#e5ddd4;--brand:#171717;--brand2:#262626;--accent:#f26522;--accent2:#ff7a2f;--good:#16865f;--danger:#c23b3b;--shadow:0 12px 30px rgba(20,20,20,.08);--r:18px}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}.hidden{display:none!important}
.login{min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 82% 14%,rgba(242,101,34,.24),transparent 28%),linear-gradient(145deg,#101010,#202020)}.login-card{width:min(430px,100%);background:#fffdfa;border-radius:26px;padding:30px;border-top:5px solid var(--accent);box-shadow:0 24px 70px rgba(0,0,0,.32)}.brandmark{margin-bottom:18px}.brand-logo-svg{display:block;height:auto}.login-logo{margin-bottom:20px}.login-logo .brand-logo-svg{width:230px;max-width:76vw}.top-logo{background:#fff;border-radius:10px;padding:4px 6px;flex:0 0 auto;box-shadow:0 4px 14px rgba(0,0,0,.16)}.top-logo .brand-logo-svg{width:80px}.top-actions{display:flex;align-items:center;gap:7px;flex:0 0 auto}.login h1{font-size:25px;margin:0 0 6px}.login p{color:var(--muted);margin:0 0 22px;line-height:1.5}.field{display:grid;gap:7px;margin-bottom:14px}.field label{font-size:13px;font-weight:700;color:#3a4657}.field input,.field select,.field textarea{width:100%;border:1px solid #d8dee8;border-radius:12px;padding:12px 13px;background:white;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:#7d8ca2;box-shadow:0 0 0 3px rgba(15,23,42,.08)}.btn{border:0;border-radius:12px;padding:11px 15px;font-weight:800;cursor:pointer}.btn.primary{background:var(--accent);color:#fff;box-shadow:0 8px 20px rgba(242,101,34,.20)}.btn.primary:hover{background:#db5317}.btn.soft{background:#f1ece6;color:var(--brand);border:1px solid #e3d9cf}.btn.danger{background:#fff0f0;color:var(--danger)}.btn.gold{background:var(--accent);color:#fff}.btn.full{width:100%}.stack{display:grid;gap:10px}.login-note{font-size:12px;color:#7a8494;margin-top:14px}.error{background:#fff2f2;border:1px solid #ffd2d2;color:#9f2f2f;padding:10px 12px;border-radius:11px;font-size:13px;margin-bottom:12px}
.app{min-height:100vh}.topbar{position:sticky;top:0;z-index:20;background:rgba(20,20,20,.97);backdrop-filter:blur(10px);color:#fff;padding:10px 18px;border-bottom:3px solid var(--accent);display:flex;align-items:center;justify-content:space-between;gap:12px}.top-left{display:flex;align-items:center;gap:11px}.mini-logo{display:flex;align-items:center}.topbar h2{font-size:16px;margin:0}.topbar small{display:block;color:#bec7d4;margin-top:1px}.iconbtn{border:0;background:rgba(255,255,255,.1);color:white;border-radius:11px;padding:9px 11px;cursor:pointer}.shell{width:min(1180px,100%);margin:auto;padding:24px 18px 50px}.hero{display:flex;align-items:end;justify-content:space-between;gap:14px;margin-bottom:18px}.hero h1{font-size:27px;margin:0 0 4px}.hero p{margin:0;color:var(--muted)}.hero-actions{display:flex;gap:8px;flex-wrap:wrap}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.metric{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:17px;box-shadow:var(--shadow);overflow:hidden}.metric:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent)}.metric span{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}.metric strong{display:block;margin-top:8px;font-size:22px;letter-spacing:-.02em}.metric em{display:block;font-style:normal;font-size:12px;color:var(--muted);margin-top:4px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:24px 0 11px}.section-head h3{margin:0;font-size:17px}.search{min-width:240px;border:1px solid var(--line);border-radius:11px;padding:9px 11px;background:#fff}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.work-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:17px;box-shadow:var(--shadow);cursor:pointer;transition:.18s transform,.18s box-shadow}.work-card:hover{transform:translateY(-2px);border-color:#f4b08d;box-shadow:0 16px 36px rgba(20,20,20,.11)}.work-title{display:flex;justify-content:space-between;gap:10px}.work-title h4{margin:0;font-size:17px}.pill{font-size:11px;padding:5px 8px;border-radius:999px;background:#fff0e7;color:#b74613;border:1px solid #ffd6c1;white-space:nowrap}.work-meta{color:var(--muted);font-size:13px;margin:7px 0 14px}.work-money{font-size:23px;font-weight:900}.work-foot{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.empty{background:#fff;border:1px dashed #cfd6df;border-radius:18px;padding:34px;text-align:center;color:var(--muted)}
.back{background:transparent;border:0;color:var(--muted);padding:0;cursor:pointer;font-weight:700;margin-bottom:12px}.detail-head{display:flex;justify-content:space-between;gap:12px;align-items:start}.detail-head h1{margin:0}.detail-head p{margin:5px 0 0;color:var(--muted)}.payer-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}.payer{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px}.payer b{display:block;font-size:13px;margin-bottom:8px}.payer strong{font-size:20px}.filters{display:grid;grid-template-columns:1.6fr 1fr 1fr auto;gap:8px;margin:12px 0}.filters input,.filters select{border:1px solid var(--line);border-radius:11px;padding:10px;background:#fff}.table-wrap{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:13px 14px;border-bottom:1px solid var(--line);font-size:13px}th{font-size:11px;text-transform:uppercase;color:var(--muted);background:#fafbfc;letter-spacing:.03em}td.money{font-weight:800;white-space:nowrap}.actions{display:flex;gap:6px}.sm{padding:7px 9px;border-radius:9px;font-size:12px}.sync{font-size:12px;color:#bfcaD8}.sync.ok{color:#b7e4d3}.sync.bad{color:#ffd0d0}
.modal-bg{position:fixed;inset:0;z-index:50;background:rgba(8,15,28,.6);display:grid;place-items:end center;padding:16px}.modal{width:min(600px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:22px;padding:20px;box-shadow:0 25px 80px rgba(0,0,0,.35)}.modal-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:16px}.modal-head h3{margin:0}.x{border:0;background:#edf1f6;border-radius:10px;width:34px;height:34px;cursor:pointer}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.danger-zone{border-top:1px solid var(--line);margin-top:18px;padding-top:16px}.smallprint{font-size:12px;color:var(--muted);line-height:1.45}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:80;background:#111827;color:#fff;border-radius:12px;padding:11px 15px;font-size:13px;box-shadow:var(--shadow)}
@media(max-width:860px){.metrics{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:repeat(2,1fr)}.filters{grid-template-columns:1fr 1fr}.payer-grid{grid-template-columns:1fr}.hero{align-items:start}.table-wrap{overflow:visible;background:transparent;border:0;box-shadow:none}table,thead,tbody,tr,th,td{display:block}thead{display:none}tr{background:#fff;border:1px solid var(--line);border-radius:15px;margin-bottom:9px;padding:10px;box-shadow:0 8px 22px rgba(15,23,42,.05)}td{border:0;padding:4px 5px}td::before{content:attr(data-label);display:inline-block;min-width:105px;color:var(--muted);font-size:11px;font-weight:700}.actions{margin-top:6px}}
@media(max-width:560px){.shell{padding:18px 12px 42px}.hero,.detail-head{display:block}.hero-actions,.detail-head .hero-actions{margin-top:12px}.metrics{grid-template-columns:1fr 1fr;gap:8px}.metric{padding:13px}.metric strong{font-size:18px}.grid{grid-template-columns:1fr}.search{min-width:0;width:100%}.section-head{align-items:stretch;flex-direction:column}.two{grid-template-columns:1fr}.filters{grid-template-columns:1fr}.topbar{padding:8px 10px;gap:8px}.top-left{gap:8px;min-width:0}.top-logo{padding:3px 4px;border-radius:8px}.top-logo .brand-logo-svg{width:60px}.top-copy{min-width:0}.topbar h2{font-size:14px;line-height:1.05;white-space:nowrap}.topbar small{font-size:10px;line-height:1.1;white-space:nowrap}.top-actions{gap:5px}.top-actions .sync{display:none}.iconbtn{padding:8px 9px;border-radius:9px;font-size:13px}.login-card{padding:26px 24px}.login-logo .brand-logo-svg{width:215px;max-width:78vw}}
</style>
</head>
<body>
<section id="loginView" class="login">
  <div class="login-card">
    <div class="brandmark login-logo"><svg class="brand-logo-svg official-logo" viewBox="0 0 360 160" role="img" aria-label="L2B Construtora">
  <text x="18" y="105" font-family="Arial Black,Arial,sans-serif" font-size="92" font-weight="900" fill="#171717">L</text>
  <g transform="translate(115,8)">
    <path fill="#ff8318" d="M0 30 47 0l47 30-17 20-30-19-30 19z"/>
    <path fill="#b93a0b" d="M77 50 94 30v54L77 104V68L47 50 17 68 0 58l47-28 30 19z"/>
    <path fill="#f26522" d="M0 82 47 52l47 30-17 20-30-19-30 19z"/>
    <path fill="#b93a0b" d="M17 102 47 83l30 19-30 19-30 18z"/>

</svg></div>

<section id="appView" class="app hidden">
  <header class="topbar">
    <div class="top-left"><div class="mini-logo top-logo"><svg class="brand-logo-svg official-logo" viewBox="0 0 360 160" role="img" aria-label="L2B Construtora">
  <text x="18" y="105" font-family="Arial Black,Arial,sans-serif" font-size="92" font-weight="900" fill="#171717">L</text>
  <g transform="translate(115,8)">
    <path fill="#ff8318" d="M0 30 47 0l47 30-17 20-30-19-30 19z"/>
    <path fill="#b93a0b" d="M77 50 94 30v54L77 104V68L47 50 17 68 0 58l47-28 30 19z"/>
    <path fill="#f26522" d="M0 82 47 52l47 30-17 20-30-19-30 19z"/>
    <path fill="#b93a0b" d="M17 102 47 83l30 19-30 19-30 18z"/>

  <text x="248" y="105" font-family="Arial Black,Arial,sans-serif" font-size="92" font-weight="900" fill="#171717">B</text>

</svg></div><div class="top-copy"><h2>Controle Financeiro</h2><small>L2B Construtora</small></div></div>
    <div class="top-actions"><span id="syncStatus" class="sync">Sincronizado</span><button id="settingsBtn" class="iconbtn" aria-label="Configurações">⚙</button><button id="logoutBtn" class="iconbtn">Sair</button></div>
  </header>
  <main id="main" class="shell"></main>
</section>
<div id="modalRoot"></div><div id="toast" class="toast hidden"></div>

<script>
(() => {
'use strict';
const API='/api/l2b-db';
const CATEGORIES=['Materiais','Mão de obra','Serviços terceirizados','Equipamentos e locações','Frete e transporte','Taxas e documentação','Alimentação','Combustível','Outros'];
const PAYERS=['L2B Construtora','Gerson','Geovane'];
const DEFAULT_DB='l2b-9bd313929d4847f6b41753dc122b70b8';
const dbId=DEFAULT_DB;
let currentPassword='';
let state=null;
let currentWorkId=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const brl=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const num=n=>Number(n||0).toLocaleString('pt-BR',{maximumFractionDigits:2});
const uid=()=>crypto.randomUUID();
const today=()=>new Date().toISOString().slice(0,10);
function showToast(msg){const el=$('#toast');el.textContent=msg;el.classList.remove('hidden');clearTimeout(showToast.t);showToast.t=setTimeout(()=>el.classList.add('hidden'),2600)}
function status(msg,type=''){const el=$('#syncStatus');el.textContent=msg;el.className='sync '+type}
function buf64(buf){return btoa(String.fromCharCode(...new Uint8Array(buf)))}
function unbuf64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}
async function derive(password,salt){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:180000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function encryptData(data,password){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),key=await derive(password,salt);const plain=new TextEncoder().encode(JSON.stringify(data));const cipher=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,plain);return {app:'l2b-financeiro-v1',salt:buf64(salt),iv:buf64(iv),data:buf64(cipher)}}
async function decryptData(payload,password){if(!payload||payload.app!=='l2b-financeiro-v1')throw new Error('Banco inválido');const salt=unbuf64(payload.salt),iv=unbuf64(payload.iv),key=await derive(password,salt);const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,unbuf64(payload.data));return JSON.parse(new TextDecoder().decode(plain))}
async function fetchBlob(){const r=await fetch(API+'?id='+encodeURIComponent(dbId),{cache:'no-store'});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Não foi possível carregar os dados');return j}
async function putBlob(payload){const r=await fetch(API+'?id='+encodeURIComponent(dbId),{method:'PUT',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify(payload)});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Não foi possível salvar os dados')}
async function createBlob(payload){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify(payload)});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Não foi possível criar o banco compartilhado');if(!j.id)throw new Error('O servidor não retornou o identificador do banco');return j.id}
async function load(){status('Sincronizando…');const p=await fetchBlob();state=await decryptData(p,currentPassword);normalize();status('Sincronizado','ok')}
function normalize(){state.version=1;state.revision=Number(state.revision||0);state.works=Array.isArray(state.works)?state.works:[];state.expenses=Array.isArray(state.expenses)?state.expenses:[]}
async function mutate(fn){status('Salvando…');try{let remote=await decryptData(await fetchBlob(),currentPassword);remote.works=Array.isArray(remote.works)?remote.works:[];remote.expenses=Array.isArray(remote.expenses)?remote.expenses:[];await fn(remote);remote.revision=Number(remote.revision||0)+1;remote.updatedAt=new Date().toISOString();await putBlob(await encryptData(remote,currentPassword));state=remote;status('Sincronizado','ok');render();showToast('Alteração salva')}catch(e){status('Erro ao salvar','bad');alert(e.message)}}
function totals(workId=null){const ex=state.expenses.filter(x=>!workId||x.workId===workId);const total=ex.reduce((a,x)=>a+Number(x.value||0),0);const by=Object.fromEntries(PAYERS.map(p=>[p,ex.filter(x=>x.payer===p).reduce((a,x)=>a+Number(x.value||0),0)]));return {total,by,count:ex.length}}
async function doLogin(){const pwd=$('#passwordInput').value;if(!pwd)return loginErr('Digite a senha.');try{currentPassword=pwd;await load();$('#loginView').classList.add('hidden');$('#appView').classList.remove('hidden');render()}catch(e){currentPassword='';loginErr('Senha incorreta ou dados indisponíveis.') }}
function loginErr(t){const e=$('#loginError');e.textContent=t;e.classList.remove('hidden')}
function render(){if(!state)return;if(currentWorkId&&!state.works.some(w=>w.id===currentWorkId))currentWorkId=null;currentWorkId?renderWork():renderDashboard()}
function renderDashboard(){const t=totals();const totalArea=state.works.reduce((a,w)=>a+Number(w.area||0),0);$('#main').innerHTML=`
<div class="hero"><div><h1>Visão geral</h1><p>Acompanhe o custo acumulado de todas as obras.</p></div><div class="hero-actions"><button class="btn soft" id="exportBtn">Exportar dados</button><button class="btn primary" id="newWorkBtn">+ Nova obra</button></div></div>
<div class="metrics"><div class="metric"><span>Obras cadastradas</span><strong>${state.works.length}</strong><em>${t.count} lançamentos</em></div><div class="metric"><span>Total investido</span><strong>${brl(t.total)}</strong><em>todas as obras</em></div><div class="metric"><span>Área cadastrada</span><strong>${num(totalArea)} m²</strong><em>soma das obras</em></div><div class="metric"><span>Custo médio geral</span><strong>${totalArea?brl(t.total/totalArea):brl(0)}/m²</strong><em>total ÷ área</em></div></div>
<div class="section-head"><h3>Obras</h3><input id="workSearch" class="search" placeholder="Buscar obra…"></div><div id="worksGrid" class="grid"></div>`;
const draw=()=>{const q=$('#workSearch').value.toLowerCase();const arr=state.works.filter(w=>(w.name+' '+(w.client||'')+' '+(w.address||'')).toLowerCase().includes(q));$('#worksGrid').innerHTML=arr.length?arr.map(w=>{const x=totals(w.id);return `<article class="work-card" data-id="${w.id}"><div class="work-title"><h4>${esc(w.name)}</h4><span class="pill">${num(w.area)} m²</span></div><div class="work-meta">${esc(w.client||w.address||'Sem identificação complementar')}</div><div class="work-money">${brl(x.total)}</div><div class="work-foot"><span>${x.count} despesas</span><b>${w.area?brl(x.total/w.area):brl(0)}/m²</b></div></article>`}).join(''):`<div class="empty" style="grid-column:1/-1">Nenhuma obra cadastrada ainda.</div>`;document.querySelectorAll('.work-card').forEach(el=>el.onclick=()=>{currentWorkId=el.dataset.id;render()})};draw();$('#workSearch').oninput=draw;$('#newWorkBtn').onclick=()=>workModal();$('#exportBtn').onclick=exportData}
function renderWork(){const w=state.works.find(x=>x.id===currentWorkId),t=totals(w.id);$('#main').innerHTML=`
<button class="back" id="backBtn">← Voltar para obras</button><div class="detail-head"><div><h1>${esc(w.name)}</h1><p>${esc([w.client,w.address].filter(Boolean).join(' • ')||'Controle financeiro da obra')}</p></div><div class="hero-actions"><button class="btn soft" id="editWorkBtn">Editar obra</button><button class="btn primary" id="newExpenseBtn">+ Despesa</button></div></div>
<div class="metrics"><div class="metric"><span>Área da obra</span><strong>${num(w.area)} m²</strong><em>informada no cadastro</em></div><div class="metric"><span>Total gasto</span><strong>${brl(t.total)}</strong><em>${t.count} lançamentos</em></div><div class="metric"><span>Custo atual por m²</span><strong>${w.area?brl(t.total/w.area):brl(0)}/m²</strong><em>total ÷ área</em></div><div class="metric"><span>Última atualização</span><strong style="font-size:16px">${state.updatedAt?new Date(state.updatedAt).toLocaleString('pt-BR'):'—'}</strong><em>dados compartilhados</em></div></div>
<div class="payer-grid">${PAYERS.map(p=>`<div class="payer"><b>${p}</b><strong>${brl(t.by[p])}</strong></div>`).join('')}</div>
<div class="section-head"><h3>Despesas</h3></div><div class="filters"><input id="expenseSearch" placeholder="Buscar descrição…"><select id="payerFilter"><option value="">Todos os pagadores</option>${PAYERS.map(p=>`<option>${p}</option>`).join('')}</select><select id="catFilter"><option value="">Todas as categorias</option>${CATEGORIES.map(c=>`<option>${c}</option>`).join('')}</select><button class="btn soft" id="clearFilter">Limpar</button></div><div id="expenseTable"></div>`;
function draw(){const q=$('#expenseSearch').value.toLowerCase(),p=$('#payerFilter').value,c=$('#catFilter').value;const arr=state.expenses.filter(x=>x.workId===w.id&&(!q||(x.description+' '+(x.notes||'')).toLowerCase().includes(q))&&(!p||x.payer===p)&&(!c||x.category===c)).sort((a,b)=>String(b.date).localeCompare(String(a.date)));$('#expenseTable').innerHTML=arr.length?`<div class="table-wrap"><table><thead><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th>Pago por</th><th>Valor</th><th></th></tr></thead><tbody>${arr.map(x=>`<tr><td data-label="Data">${new Date(x.date+'T12:00:00').toLocaleDateString('pt-BR')}</td><td data-label="Descrição"><b>${esc(x.description)}</b>${x.notes?`<div style="font-size:11px;color:var(--muted);margin-top:3px">${esc(x.notes)}</div>`:''}</td><td data-label="Categoria">${esc(x.category)}</td><td data-label="Pago por">${esc(x.payer)}</td><td data-label="Valor" class="money">${brl(x.value)}</td><td data-label="Ações"><div class="actions"><button class="btn soft sm edit-exp" data-id="${x.id}">Editar</button><button class="btn danger sm del-exp" data-id="${x.id}">Excluir</button></div></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">Nenhuma despesa encontrada.</div>`;document.querySelectorAll('.edit-exp').forEach(b=>b.onclick=()=>expenseModal(b.dataset.id));document.querySelectorAll('.del-exp').forEach(b=>b.onclick=()=>deleteExpense(b.dataset.id))}draw();['#expenseSearch','#payerFilter','#catFilter'].forEach(s=>$(s).oninput=draw);$('#clearFilter').onclick=()=>{$('#expenseSearch').value='';$('#payerFilter').value='';$('#catFilter').value='';draw()};$('#backBtn').onclick=()=>{currentWorkId=null;render()};$('#newExpenseBtn').onclick=()=>expenseModal();$('#editWorkBtn').onclick=()=>workModal(w.id)}
function modal(title,body,footer=''){const root=$('#modalRoot');root.innerHTML=`<div class="modal-bg"><div class="modal"><div class="modal-head"><h3>${title}</h3><button class="x" id="modalClose">×</button></div>${body}${footer}</div></div>`;$('#modalClose').onclick=closeModal;root.querySelector('.modal-bg').onclick=e=>{if(e.target.classList.contains('modal-bg'))closeModal()}}
function closeModal(){$('#modalRoot').innerHTML=''}
function workModal(id=null){const w=id?state.works.find(x=>x.id===id):null;modal(w?'Editar obra':'Nova obra',`<form id="workForm"><div class="field"><label>Nome da obra *</label><input id="wName" required value="${esc(w?.name||'')}"></div><div class="two"><div class="field"><label>Metragem da obra (m²) *</label><input id="wArea" type="number" min="0.01" step="0.01" required value="${w?.area||''}"></div><div class="field"><label>Cliente</label><input id="wClient" value="${esc(w?.client||'')}"></div></div><div class="field"><label>Endereço / referência</label><input id="wAddress" value="${esc(w?.address||'')}"></div><div class="modal-foot"><button type="button" class="btn soft" id="cancelWork">Cancelar</button><button class="btn primary">Salvar obra</button></div>${w?`<div class="danger-zone"><button type="button" class="btn danger" id="deleteWork">Excluir obra</button><div class="smallprint">Ao excluir a obra, todos os lançamentos dela também serão removidos.</div></div>`:''}</form>`);$('#cancelWork').onclick=closeModal;$('#workForm').onsubmit=async e=>{e.preventDefault();const obj={name:$('#wName').value.trim(),area:Number($('#wArea').value),client:$('#wClient').value.trim(),address:$('#wAddress').value.trim()};if(!obj.name||!obj.area)return;closeModal();await mutate(d=>{if(w)Object.assign(d.works.find(x=>x.id===w.id),obj);else d.works.push({id:uid(),createdAt:new Date().toISOString(),...obj})})};if(w)$('#deleteWork').onclick=async()=>{if(confirm('Excluir esta obra e todas as despesas vinculadas?')){closeModal();currentWorkId=null;await mutate(d=>{d.works=d.works.filter(x=>x.id!==w.id);d.expenses=d.expenses.filter(x=>x.workId!==w.id)})}}}
function expenseModal(id=null){const x=id?state.expenses.find(y=>y.id===id):null;modal(x?'Editar despesa':'Nova despesa',`<form id="expenseForm"><div class="field"><label>Descrição *</label><input id="eDesc" required value="${esc(x?.description||'')}"></div><div class="two"><div class="field"><label>Valor (R$) *</label><input id="eValue" type="number" min="0.01" step="0.01" required value="${x?.value||''}"></div><div class="field"><label>Data *</label><input id="eDate" type="date" required value="${x?.date||today()}"></div></div><div class="two"><div class="field"><label>Pago por *</label><select id="ePayer">${PAYERS.map(p=>`<option ${x?.payer===p?'selected':''}>${p}</option>`).join('')}</select></div><div class="field"><label>Categoria *</label><select id="eCategory">${CATEGORIES.map(c=>`<option ${x?.category===c?'selected':''}>${c}</option>`).join('')}</select></div></div><div class="field"><label>Observação</label><textarea id="eNotes" rows="3" placeholder="NF, fornecedor, detalhes…">${esc(x?.notes||'')}</textarea></div><div class="modal-foot"><button type="button" class="btn soft" id="cancelExpense">Cancelar</button><button class="btn primary">Salvar despesa</button></div></form>`);$('#cancelExpense').onclick=closeModal;$('#expenseForm').onsubmit=async e=>{e.preventDefault();const obj={description:$('#eDesc').value.trim(),value:Number($('#eValue').value),date:$('#eDate').value,payer:$('#ePayer').value,category:$('#eCategory').value,notes:$('#eNotes').value.trim()};if(!obj.description||!obj.value)return;closeModal();await mutate(d=>{if(x)Object.assign(d.expenses.find(y=>y.id===x.id),obj);else d.expenses.push({id:uid(),workId:currentWorkId,createdAt:new Date().toISOString(),...obj})})}}
async function deleteExpense(id){if(confirm('Excluir esta despesa?'))await mutate(d=>{d.expenses=d.expenses.filter(x=>x.id!==id)})}
function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='L2B_FINANCEIRO_BACKUP_'+today()+'.json';a.click();URL.revokeObjectURL(a.href)}
function settingsModal(){const share=location.origin+location.pathname;modal('Configurações',`<div class="field"><label>Link compartilhado</label><input id="shareLink" readonly value="${esc(share)}"></div><button class="btn soft" id="copyLink">Copiar link</button><div class="danger-zone"><h4 style="margin:0 0 10px">Alterar senha</h4><div class="field"><label>Nova senha</label><input id="newPassword" type="password" placeholder="Mínimo 6 caracteres"></div><button class="btn primary" id="changePassword">Alterar senha</button><p class="smallprint">Depois da troca, todos deverão usar a nova senha para abrir este mesmo link.</p></div>`);$('#copyLink').onclick=async()=>{await navigator.clipboard.writeText(share);showToast('Link copiado')};$('#changePassword').onclick=async()=>{const np=$('#newPassword').value;if(np.length<6)return alert('Use pelo menos 6 caracteres.');try{status('Alterando senha…');await putBlob(await encryptData(state,np));currentPassword=np;closeModal();status('Sincronizado','ok');showToast('Senha alterada')}catch(e){alert(e.message)}}}
$('#loginBtn').onclick=doLogin;$('#passwordInput').onkeydown=e=>{if(e.key==='Enter')doLogin()};$('#logoutBtn').onclick=()=>{currentPassword='';state=null;currentWorkId=null;$('#appView').classList.add('hidden');$('#loginView').classList.remove('hidden');$('#passwordInput').value=''};$('#settingsBtn').onclick=settingsModal;
})();
</script>
</body>
</html>
