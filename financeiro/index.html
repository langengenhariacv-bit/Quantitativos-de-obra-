function buf64(buf){return btoa(String.fromCharCode(...new Uint8Array(buf)))}
function unbuf64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}
async function derive(password,salt){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:180000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function encryptData(data,password){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),key=await derive(password,salt);const plain=new TextEncoder().encode(JSON.stringify(data));const cipher=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,plain);return {app:'l2b-financeiro-v1',salt:buf64(salt),iv:buf64(iv),data:buf64(cipher)}}
async function decryptData(payload,password){if(!payload||payload.app!=='l2b-financeiro-v1')throw new Error('Banco inválido');const salt=unbuf64(payload.salt),iv=unbuf64(payload.iv),key=await derive(password,salt);const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,unbuf64(payload.data));return JSON.parse(new TextDecoder().decode(plain))}

function applyWithdrawalSeed(){
if(Number(state.withdrawalSeedVersion||0)>=WITHDRAWAL_SEED_VERSION)return false;

state.withdrawalSeedVersion=WITHDRAWAL_SEED_VERSION;
return true;
}
async function load(){

await putBlob(await encryptData(state,currentPassword));

function normalize(){
state.version=1;

state.works=Array.isArray(state.works)?state.works:[];

state.withdrawals=Array.isArray(state.withdrawals)?state.withdrawals:(Array.isArray(state.advances)?state.advances:[]);
}
async function mutate(fn){status('Salvando…');try{let remote=await decryptData(await fetchBlob(),currentPassword);remote.works=Array.isArray(remote.works)?remote.works:[];remote.expenses=Array.isArray(remote.expenses)?remote.expenses:[];remote.withdrawals=Array.isArray(remote.withdrawals)?remote.withdrawals:(Array.isArray(remote.advances)?remote.advances:[]);await fn(remote);remote.revision=Number(remote.revision||0)+1;remote.updatedAt=new Date().toISOString();await putBlob(await encryptData(remote,currentPassword));state=remote;status('Sincronizado','ok');render();showToast('Alteração salva')}catch(e){status('Erro ao salvar','bad');alert(e.message)}}
function totals(workId=null){const ex=state.expenses.filter(x=>!workId||x.workId===workId);const total=ex.reduce((a,x)=>a+Number(x.value||0),0);const by=Object.fromEntries(PAYERS.map(p=>[p,ex.filter(x=>x.payer===p).reduce((a,x)=>a+Number(x.value||0),0)]));return {total,by,count:ex.length}}
async function doLogin(){const pwd=$('#passwordInput').value;if(!pwd)return loginErr('Digite a senha.');try{currentPassword=pwd;await load();$('#loginView').classList.add('hidden');$('#appView').classList.remove('hidden');render()}catch(e){currentPassword='';loginErr('Senha incorreta ou dados indisponíveis.') }}
function loginErr(t){const e=$('#loginError');e.textContent=t;e.classList.remove('hidden')}
function navTabs(active='works'){return `<div class="app-tabs">
<button class="app-tab ${active==='works'?'active':''}" data-section="works">Obras</button>
<button class="app-tab ${active==='withdrawals'?'active':''}" data-section="withdrawals">Retiradas</button>
</div>`}
function personTabs(person){return `<div class="person-tabs">
<button class="person-tab ${person==='Geovane'?'active':''}" data-person="Geovane">Geovane</button>
<button class="person-tab ${person==='Gerson'?'active':''}" data-person="Gerson">Gerson</button>
</div>`}
function bindTabs(){
document.querySelectorAll('.app-tab').forEach(b=>b.onclick=()=>{currentWorkId=null;currentSection=b.dataset.section;render()});
document.querySelectorAll('.person-tab').forEach(b=>b.onclick=()=>{currentPerson=b.dataset.person;currentSection='withdrawals';render()})
}
function render(){if(!state)return;if(currentWorkId&&!state.works.some(w=>w.id===currentWorkId))currentWorkId=null;if(currentWorkId)return renderWork();if(currentSection==='works')return renderDashboard();return renderWithdrawals(currentPerson)}
function renderDashboard(){const t=totals();const totalArea=state.works.reduce((a,w)=>a+Number(w.area||0),0);$('#main').innerHTML=`${navTabs('works')}
<div class="hero"><div><h1>Visão geral</h1><p>Acompanhe o custo acumulado de todas as obras.</p></div><div class="hero-actions"><button class="btn soft" id="exportBtn">Exportar dados</button><button class="btn primary" id="newWorkBtn">+ Nova obra</button></div></div>
<div class="metrics"><div class="metric"><span>Obras cadastradas</span><strong>${state.works.length}</strong><em>${t.count} lançamentos</em></div><div class="metric"><span>Total investido</span><strong>${brl(t.total)}</strong><em>todas as obras</em></div><div class="metric"><span>Área cadastrada</span><strong>${num(totalArea)} m²</strong><em>soma das obras</em></div><div class="metric"><span>Custo médio geral</span><strong>${totalArea?brl(t.total/totalArea):brl(0)}/m²</strong><em>total ÷ área</em></div></div>
<div class="section-head"><h3>Obras</h3><input id="workSearch" class="search" placeholder="Buscar obra…"></div><div id="worksGrid" class="grid"></div>`;
bindTabs();const draw=()=>{const q=$('#workSearch').value.toLowerCase();const arr=state.works.filter(w=>(w.name+' '+(w.client||'')+' '+(w.address||'')).toLowerCase().includes(q));$('#worksGrid').innerHTML=arr.length?arr.map(w=>{const x=totals(w.id);return `<article class="work-card" data-id="${w.id}"><div class="work-title"><h4>${esc(w.name)}</h4><span class="pill">${num(w.area)} m²</span></div><div class="work-meta">${esc(w.client||w.address||'Sem identificação complementar')}</div><div class="work-money">${brl(x.total)}</div><div class="work-foot"><span>${x.count} despesas</span><b>${w.area?brl(x.total/w.area):brl(0)}/m²</b></div></article>`}).join(''):`<div class="empty" style="grid-column:1/-1">Nenhuma obra cadastrada ainda.</div>`;document.querySelectorAll('.work-card').forEach(el=>el.onclick=()=>{currentWorkId=el.dataset.id;render()})};draw();$('#workSearch').oninput=draw;$('#newWorkBtn').onclick=()=>workModal();$('#exportBtn').onclick=exportData}
function withdrawalDate(x){if(x.date)return new Date(x.date+'T12:00:00').toLocaleDateString('pt-BR');return x.dateText||'—'}
function renderWithdrawals(person){
const list=state.withdrawals.filter(x=>x.person===person).slice().sort((a,b)=>{
const ad=a.date||'',bd=b.date||'';if(ad&&bd)return bd.localeCompare(ad);if(ad&&!bd)return -1;if(!ad&&bd)return 1;
return String(a.sourceId||'').localeCompare(String(b.sourceId||''));
});
const total=list.reduce((a,x)=>a+Number(x.value||0),0);
const positives=list.filter(x=>Number(x.value)>=0).reduce((a,x)=>a+Number(x.value||0),0);
const negatives=list.filter(x=>Number(x.value)<0).reduce((a,x)=>a+Number(x.value||0),0);
$('#main').innerHTML=`${navTabs('withdrawals')}${personTabs(person)}
<div class="hero"><div><h1>Retiradas — ${esc(person)}</h1><p>Controle separado das retiradas de ${esc(person)}.</p></div><div class="hero-actions"><button class="btn primary" id="newWithdrawalBtn">+ Retirada</button></div></div>
<div class="metrics">
<div class="metric"><span>Saldo de retiradas</span><strong>${brl(total)}</strong><em>retiradas menos abatimentos</em></div>
<div class="metric"><span>Retiradas positivas</span><strong>${brl(positives)}</strong><em>valores lançados</em></div>
<div class="metric"><span>Abatimentos</span><strong class="withdraw-negative">${brl(negatives)}</strong><em>valores negativos</em></div>
<div class="metric"><span>Lançamentos</span><strong>${list.length}</strong><em>registros</em></div>
</div>
<div class="section-head"><div><h3>Histórico de retiradas</h3><div class="advance-note">As retiradas ficam separadas das despesas das obras e não entram no custo por m².</div></div></div>
<div id="withdrawalTable"></div>`;
bindTabs();
$('#newWithdrawalBtn').onclick=()=>withdrawalModal(person);
$('#withdrawalTable').innerHTML=list.length?`<div class="table-wrap"><table><thead><tr><th>Data</th><th>Descrição</th><th>Valor</th><th>Observação</th><th></th></tr></thead><tbody>${list.map(x=>`<tr>
<td data-label="Data">${withdrawalDate(x)}</td>
<td data-label="Descrição"><b>${esc(x.description||'Retirada')}</b></td>
<td data-label="Valor" class="money ${Number(x.value)<0?'negative':''}">${brl(x.value)}</td>
<td data-label="Observação">${esc(x.notes||'—')}</td>
<td data-label="Ações"><div class="actions"><button class="btn soft sm edit-with" data-id="${x.id}">Editar</button><button class="btn danger sm del-with" data-id="${x.id}">Excluir</button></div></td>
</tr>`).join('')}</tbody></table></div>`:`<div class="empty">Nenhuma retirada lançada para ${esc(person)}.</div>`;
document.querySelectorAll('.edit-with').forEach(b=>b.onclick=()=>withdrawalModal(person,b.dataset.id));
document.querySelectorAll('.del-with').forEach(b=>b.onclick=()=>deleteWithdrawal(b.dataset.id));
}
function renderWork(){const w=state.works.find(x=>x.id===currentWorkId),t=totals(w.id);$('#main').innerHTML=`
<button class="back" id="backBtn">← Voltar para obras</button><div class="detail-head"><div><h1>${esc(w.name)}</h1><p>${esc([w.client,w.address].filter(Boolean).join(' • ')||'Controle financeiro da obra')}</p></div><div class="hero-actions"><button class="btn soft" id="editWorkBtn">Editar obra</button><button class="btn primary" id="newExpenseBtn">+ Despesa</button></div></div>
<div class="metrics"><div class="metric"><span>Área da obra</span><strong>${num(w.area)} m²</strong><em>informada no cadastro</em></div><div class="metric"><span>Total gasto</span><strong>${brl(t.total)}</strong><em>${t.count} lançamentos</em></div><div class="metric"><span>Custo atual por m²</span><strong>${w.area?brl(t.total/w.area):brl(0)}/m²</strong><em>total ÷ área</em></div><div class="metric"><span>Última atualização</span><strong style="font-size:16px">${state.updatedAt?new Date(state.updatedAt).toLocaleString('pt-BR'):'—'}</strong><em>dados compartilhados</em></div></div>
<div class="payer-grid">${PAYERS.map(p=>`<div class="payer"><b>${p}</b><strong>${brl(t.by[p])}</strong></div>`).join('')}</div>
<div class="section-head"><h3>Despesas</h3></div><div class="filters"><input id="expenseSearch" placeholder="Buscar descrição…"><select id="payerFilter"><option value="">Todos os pagadores</option>${PAYERS.map(p=>`<option>${p}</option>`).join('')}</select><select id="catFilter"><option value="">Todas as categorias</option>${CATEGORIES.map(c=>`<option>${c}</option>`).join('')}</select><button class="btn soft" id="clearFilter">Limpar</button></div><div id="expenseTable"></div>`;
function draw(){const q=$('#expenseSearch').value.toLowerCase(),p=$('#payerFilter').value,c=$('#catFilter').value;const arr=state.expenses.filter(x=>x.workId===w.id&&(!q||(x.description+' '+(x.notes||'')).toLowerCase().includes(q))&&(!p||x.payer===p)&&(!c||x.category===c)).sort((a,b)=>String(b.date).localeCompare(String(a.date)));$('#expenseTable').innerHTML=arr.length?`<div class="table-wrap"><table><thead><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th>Pago por</th><th>Valor</th><th></th></tr></thead><tbody>${arr.map(x=>`<tr><td data-label="Data">${new Date(x.date+'T12:00:00').toLocaleDateString('pt-BR')}</td><td data-label="Descrição"><b>${esc(x.description)}</b>${x.notes?`<div style="font-size:11px;color:var(--muted);margin-top:3px">${esc(x.notes)}</div>`:''}</td><td data-label="Categoria">${esc(x.category)}</td><td data-label="Pago por">${esc(x.payer)}</td><td data-label="Valor" class="money">${brl(x.value)}</td><td data-label="Ações"><div class="actions"><button class="btn soft sm edit-exp" data-id="${x.id}">Editar</button><button class="btn danger sm del-exp" data-id="${x.id}">Excluir</button></div></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">Nenhuma despesa encontrada.</div>`;document.querySelectorAll('.edit-exp').forEach(b=>b.onclick=()=>expenseModal(b.dataset.id));document.querySelectorAll('.del-exp').forEach(b=>b.onclick=()=>deleteExpense(b.dataset.id))}draw();['#expenseSearch','#payerFilter','#catFilter'].forEach(s=>$(s).oninput=draw);$('#clearFilter').onclick=()=>{$('#expenseSearch').value='';$('#payerFilter').value='';$('#catFilter').value='';draw()};$('#backBtn').onclick=()=>{currentWorkId=null;currentSection='works';render()};$('#newExpenseBtn').onclick=()=>expenseModal();$('#editWorkBtn').onclick=()=>workModal(w.id)}
function modal(title,body,footer=''){const root=$('#modalRoot');root.innerHTML=`<div class="modal-bg"><div class="modal"><div class="modal-head"><h3>${title}</h3><button class="x" id="modalClose">×</button></div>${body}${footer}</div></div>`;$('#modalClose').onclick=closeModal;root.querySelector('.modal-bg').onclick=e=>{if(e.target.classList.contains('modal-bg'))closeModal()}}
function closeModal(){$('#modalRoot').innerHTML=''}
function workModal(id=null){const w=id?state.works.find(x=>x.id===id):null;modal(w?'Editar obra':'Nova obra',`<form id="workForm"><div class="field"><label>Nome da obra *</label><input id="wName" required value="${esc(w?.name||'')}"></div><div class="two"><div class="field"><label>Metragem da obra (m²) *</label><input id="wArea" type="number" min="0.01" step="0.01" required value="${w?.area||''}"></div><div class="field"><label>Cliente</label><input id="wClient" value="${esc(w?.client||'')}"></div></div><div class="field"><label>Endereço / referência</label><input id="wAddress" value="${esc(w?.address||'')}"></div><div class="modal-foot"><button type="button" class="btn soft" id="cancelWork">Cancelar</button><button class="btn primary">Salvar obra</button></div>${w?`<div class="danger-zone"><button type="button" class="btn danger" id="deleteWork">Excluir obra</button><div class="smallprint">Ao excluir a obra, todos os lançamentos dela também serão removidos.</div></div>`:''}</form>`);$('#cancelWork').onclick=closeModal;$('#workForm').onsubmit=async e=>{e.preventDefault();const obj={name:$('#wName').value.trim(),area:Number($('#wArea').value),client:$('#wClient').value.trim(),address:$('#wAddress').value.trim()};if(!obj.name||!obj.area)return;closeModal();await mutate(d=>{if(w)Object.assign(d.works.find(x=>x.id===w.id),obj);else d.works.push({id:uid(),createdAt:new Date().toISOString(),...obj})})};if(w)$('#deleteWork').onclick=async()=>{if(confirm('Excluir esta obra e todas as despesas vinculadas?')){closeModal();currentWorkId=null;await mutate(d=>{d.works=d.works.filter(x=>x.id!==w.id);d.expenses=d.expenses.filter(x=>x.workId!==w.id)})}}}
function expenseModal(id=null){const x=id?state.expenses.find(y=>y.id===id):null;modal(x?'Editar despesa':'Nova despesa',`<form id="expenseForm"><div class="field"><label>Descrição *</label><input id="eDesc" required value="${esc(x?.description||'')}"></div><div class="two"><div class="field"><label>Valor (R$) *</label><input id="eValue" type="number" min="0.01" step="0.01" required value="${x?.value||''}"></div><div class="field"><label>Data *</label><input id="eDate" type="date" required value="${x?.date||today()}"></div></div><div class="two"><div class="field"><label>Pago por *</label><select id="ePayer">${PAYERS.map(p=>`<option ${x?.payer===p?'selected':''}>${p}</option>`).join('')}</select></div><div class="field"><label>Categoria *</label><select id="eCategory">${CATEGORIES.map(c=>`<option ${x?.category===c?'selected':''}>${c}</option>`).join('')}</select></div></div><div class="field"><label>Observação</label><textarea id="eNotes" rows="3" placeholder="NF, fornecedor, detalhes…">${esc(x?.notes||'')}</textarea></div><div class="modal-foot"><button type="button" class="btn soft" id="cancelExpense">Cancelar</button><button class="btn primary">Salvar despesa</button></div></form>`);$('#cancelExpense').onclick=closeModal;$('#expenseForm').onsubmit=async e=>{e.preventDefault();const obj={description:$('#eDesc').value.trim(),value:Number($('#eValue').value),date:$('#eDate').value,payer:$('#ePayer').value,category:$('#eCategory').value,notes:$('#eNotes').value.trim()};if(!obj.description||!obj.value)return;closeModal();await mutate(d=>{if(x)Object.assign(d.expenses.find(y=>y.id===x.id),obj);else d.expenses.push({id:uid(),workId:currentWorkId,createdAt:new Date().toISOString(),...obj})})}}
function withdrawalModal(person,id=null){
const x=id?state.withdrawals.find(y=>y.id===id):null;
modal(x?'Editar retirada':'Nova retirada',`<form id="withdrawalForm">
<div class="field"><label>Descrição *</label><input id="wdrDesc" required value="${esc(x?.description||'Retirada')}"></div>
<div class="two"><div class="field"><label>Valor (R$) *</label><input id="wdrValue" type="number" step="0.01" required value="${x?.value??''}"></div><div class="field"><label>Data</label><input id="wdrDate" type="date" value="${x?.date||''}"></div></div>
<div class="field"><label>Data como texto</label><input id="wdrDateText" value="${esc(x?.dateText||'')}" placeholder="Ex.: 01/set"></div>
<div class="field"><label>Observação</label><textarea id="wdrNotes" rows="3" placeholder="Cheque, PIX, referência…">${esc(x?.notes||'')}</textarea></div>
<div class="modal-foot"><button type="button" class="btn soft" id="cancelWithdrawal">Cancelar</button><button class="btn primary">Salvar retirada</button></div>
</form>`);
$('#cancelWithdrawal').onclick=closeModal;
$('#withdrawalForm').onsubmit=async e=>{e.preventDefault();const obj={person,description:$('#wdrDesc').value.trim(),value:Number($('#wdrValue').value),date:$('#wdrDate').value||'',dateText:$('#wdrDateText').value.trim(),notes:$('#wdrNotes').value.trim()};if(!obj.description||!Number.isFinite(obj.value))return;closeModal();await mutate(d=>{if(x)Object.assign(d.withdrawals.find(y=>y.id===x.id),obj);else d.withdrawals.push({id:uid(),createdAt:new Date().toISOString(),...obj})})}
}
async function deleteWithdrawal(id){if(confirm('Excluir esta retirada?'))await mutate(d=>{d.withdrawals=d.withdrawals.filter(x=>x.id!==id)})}
async function deleteExpense(id){if(confirm('Excluir esta despesa?'))await mutate(d=>{d.expenses=d.expenses.filter(x=>x.id!==id)})}
function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='L2B_FINANCEIRO_BACKUP_'+today()+'.json';a.click();URL.revokeObjectURL(a.href)}
function settingsModal(){const share=location.origin+location.pathname;modal('Configurações',`<div class="field"><label>Link compartilhado</label><input id="shareLink" readonly value="${esc(share)}"></div><button class="btn soft" id="copyLink">Copiar link</button><div class="danger-zone"><h4 style="margin:0 0 10px">Alterar senha</h4><div class="field"><label>Nova senha</label><input id="newPassword" type="password" placeholder="Mínimo 6 caracteres"></div><button class="btn primary" id="changePassword">Alterar senha</button><p class="smallprint">Depois da troca, todos deverão usar a nova senha para abrir este mesmo link.</p></div>`);$('#copyLink').onclick=async()=>{await navigator.clipboard.writeText(share);showToast('Link copiado')};$('#changePassword').onclick=async()=>{const np=$('#newPassword').value;if(np.length<6)return alert('Use pelo menos 6 caracteres.');try{status('Alterando senha…');await putBlob(await encryptData(state,np));currentPassword=np;closeModal();status('Sincronizado','ok');showToast('Senha alterada')}catch(e){alert(e.message)}}}

// PWA
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js',{scope:'./'}).catch(()=>{}));
}
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();
  deferredInstallPrompt=e;
  const b=$('#installBtn'),h=$('#installHint');
  if(b)b.classList.remove('hidden');
  if(h)h.classList.remove('hidden');
});
window.addEventListener('appinstalled',()=>{
  deferredInstallPrompt=null;
  const b=$('#installBtn'),h=$('#installHint');
  if(b)b.classList.add('hidden');
  if(h)h.classList.add('hidden');
  showToast('L2B Financeiro instalado');
});
async function installPWA(){
  if(!deferredInstallPrompt){
    alert('No Android, abra o menu do navegador e escolha “Instalar app” ou “Adicionar à tela inicial”.');
    return;
  }
  deferredInstallPrompt.prompt();
  await deferredInstallPrompt.userChoice;
  deferredInstallPrompt=null;
  $('#installBtn')?.classList.add('hidden');
  $('#installHint')?.classList.add('hidden');
}

$('#loginBtn').onclick=doLogin;$('#passwordInput').onkeydown=e=>{if(e.key==='Enter')doLogin()};$('#installBtn').onclick=installPWA;$('#logoutBtn').onclick=()=>{currentPassword='';state=null;currentWorkId=null;currentSection='works';currentPerson='Geovane';$('#appView').classList.add('hidden');$('#loginView').classList.remove('hidden');$('#passwordInput').value=''};$('#settingsBtn').onclick=settingsModal;
})();
</script>
</body>
</html>
