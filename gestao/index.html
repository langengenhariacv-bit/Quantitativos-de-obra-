function liveFinance(arr=state.finance){return (arr||[]).filter(x=>!x.voided)}
function pendingReceivableRows(arr=state.finance){
 const live=liveFinance(arr),receipts={};
 const key=x=>x.projectId||('client:'+String(x.clientId||''));
 live.filter(x=>x.type==='Recebimento').forEach(x=>{const k=key(x);receipts[k]=(receipts[k]||0)+Number(x.value||0)});
 const rows=live.filter(x=>x.type==='A receber').slice().sort((a,b)=>(a.dueDate||a.date||'9999').localeCompare(b.dueDate||b.date||'9999'));
 return rows.map(x=>{const k=key(x),available=receipts[k]||0,applied=Math.min(available,Number(x.value||0)),remaining=Math.max(0,Number(x.value||0)-applied);receipts[k]=Math.max(0,available-applied);return {...x,remaining}}).filter(x=>x.remaining>0.005);
}
function financeSummaryFor(arr=state.finance){
 const live=liveFinance(arr),pending=pendingReceivableRows(arr);
 const received=live.filter(x=>x.type==='Recebimento').reduce((a,x)=>a+Number(x.value||0),0);
 const contracted=live.filter(x=>x.type==='A receber').reduce((a,x)=>a+Number(x.value||0),0);
 const reimb=live.filter(x=>x.type==='Reembolso'&&!x.reimbursed).reduce((a,x)=>a+Number(x.value||0),0);
 const expense=live.filter(x=>x.type==='Despesa').reduce((a,x)=>a+Number(x.value||0),0);
 const receivable=pending.reduce((a,x)=>a+x.remaining,0);
 const overdue=pending.filter(x=>x.dueDate&&x.dueDate<today()).reduce((a,x)=>a+x.remaining,0);
 const undated=pending.filter(x=>!x.dueDate).reduce((a,x)=>a+x.remaining,0);
 return {received,contracted,receivable,reimb,expense,overdue,undated,pending};
}
function financeSums(){return financeSummaryFor(state.finance)}
function projectFinanceSummary(projectId){return financeSummaryFor(state.finance.filter(x=>x.projectId===projectId))}
function projectName(id){return state.projects.find(p=>p.id===id)?.name||'—'}
function financeTable(arr){
 const rows=(arr||[]).slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));
 return rows.length?`<div class="table-wrap"><table><thead><tr><th>Data</th><th>Vencimento</th><th>Tipo</th><th>Cliente</th><th>Projeto</th><th>Descrição</th><th>Valor</th><th>Ações</th></tr></thead><tbody>${rows.map(x=>`<tr style="${x.voided?'opacity:.55;text-decoration:line-through':''}"><td data-label="Data">${fmtDate(x.date)}</td><td data-label="Vencimento">${x.dueDate?fmtDate(x.dueDate):'—'}</td><td data-label="Tipo"><span class="pill ${x.type==='Recebimento'||(x.type==='Reembolso'&&x.reimbursed)?'good':x.type==='Despesa'?'warn':''}">${esc(x.type)}${x.type==='Reembolso'&&x.reimbursed?' · reembolsado':''}${x.voided?' · estornado':''}</span></td><td data-label="Cliente">${esc(clientName(x.clientId))}</td><td data-label="Projeto">${esc(projectName(x.projectId))}</td><td data-label="Descrição">${esc(x.description||'—')}${x.voided&&x.voidReason?`<div class="meta">Motivo: ${esc(x.voidReason)}</div>`:''}</td><td data-label="Valor" class="money">${brl(x.value)}</td><td data-label="Ações"><div class="table-actions"><button class="btn soft sm edit-fin" data-id="${x.id}" ${x.voided?'disabled':''}>Editar</button>${x.type==='Recebimento'&&!x.voided?`<button class="btn soft sm receipt-fin" data-id="${x.id}">Recibo</button>`:''}${x.type==='Reembolso'&&!x.voided?`<button class="btn good sm toggle-reimb" data-id="${x.id}">${x.reimbursed?'Reabrir reembolso':'Valor reembolsado'}</button>`:''}${x.voided?`<button class="btn soft sm reopen-fin" data-id="${x.id}">Reabrir</button>`:`<button class="btn danger sm void-fin" data-id="${x.id}">Estornar</button>`}</div></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Nenhum lançamento financeiro.</div>';
}
function renderFinance(){
 const s=financeSums();
 const byClient={};s.pending.forEach(x=>{byClient[x.clientId]=(byClient[x.clientId]||0)+x.remaining});
 const receivableBy=Object.entries(byClient).map(([id,v])=>({id,v,name:clientName(id)})).filter(x=>x.v>0.005).sort((a,b)=>b.v-a.v);
 const reimbBy=state.clients.map(c=>({c,v:liveFinance().filter(x=>x.clientId===c.id&&x.type==='Reembolso'&&!x.reimbursed).reduce((a,x)=>a+Number(x.value||0),0)})).filter(x=>x.v);

function normService(v){return String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim()}
function serviceInfo(name){
 const n=normService(name);
 if(!n)return {name:'Serviços de engenharia',description:'Prestação de serviço técnico de engenharia conforme objeto, documentos e condições definidos nesta proposta.',scope:['Desenvolvimento das atividades técnicas expressamente descritas nesta proposta']};
 return SERVICE_CATALOG.find(s=>s.keys.some(k=>n.includes(normService(k))||normService(k).includes(n)))||{name:name||'Serviço de engenharia',description:'Prestação de serviço técnico de engenharia conforme objeto, documentos e condições definidos nesta proposta.',scope:['Desenvolvimento das atividades técnicas expressamente descritas nesta proposta']};
}
function budgetServiceDescription(b){return String(b?.serviceDescription||'').trim()||serviceInfo(b?.service).description}
function budgetServiceScope(b){
 const raw=String(b?.serviceScope||'').trim();
 if(raw)return raw.split(/\n+/).map(x=>x.replace(/^[\s•\-–—]+/,'').trim()).filter(Boolean);
 return serviceInfo(b?.service).scope;
}

async function budgetLogoPng(){
 try{
   const svg=await fetch('assets/lang-logo.svg',{cache:'force-cache'}).then(r=>r.text());
   const blob=new Blob([svg],{type:'image/svg+xml'}),url=URL.createObjectURL(blob),img=new Image();
   await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src=url});
   const canvas=document.createElement('canvas');canvas.width=900;canvas.height=360;
   const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);
   URL.revokeObjectURL(url);return canvas.toDataURL('image/png');
 }catch(_){return null}
}

   doc.text('Validade: '+validity+' dias',W-M-7,y+18,{align:'right'});
   if(b.firstDueDate)doc.text('1º vencimento: '+fmtDate(b.firstDueDate),W-M-7,y+24,{align:'right'});
   y+=41;

   sectionTitle('Serviço proposto');
   doc.setFont('helvetica','bold');doc.setFontSize(14);setColor(C.ink);const svcTitle=doc.splitTextToSize(b.service||b.title||'Serviço de engenharia',W-2*M);doc.text(svcTitle,M,y);y+=svcTitle.length*6+3;
   textBlock(desc,9.4,C.ink,W-2*M,4.8);y+=2;

   sectionTitle('Escopo previsto');

   y+=3;

   sectionTitle('Condições comerciais');

   if(b.firstDueDate)labelValue('1º vencimento',fmtDate(b.firstDueDate));
   if(b.deadline)labelValue('Prazo / retorno',fmtDate(b.deadline));
   labelValue('Validade da proposta',validity+' dias a partir da emissão');
   if(b.notes){y+=3;sectionTitle('Observações');textBlock(b.notes,9,C.ink,W-2*M,4.7)}

   ensure(34);y+=6;
   roundedBox(M,y,W-2*M,25,[252,248,245],C.line);
   doc.setFont('helvetica','bold');doc.setFontSize(9);setColor(C.ink);doc.text('Próximo passo',M+7,y+8);
   doc.setFont('helvetica','normal');doc.setFontSize(8.7);setColor(C.muted);
   const next=doc.splitTextToSize('Após a aprovação desta proposta, o serviço poderá ser formalizado e inserido no fluxo de execução da LANG Engenharia.',W-2*M-14);
   doc.text(next,M+7,y+14);y+=32;

   doc.setFont('helvetica','normal');doc.setFontSize(7.6);setColor(C.muted);
   const ref='Descrição técnica resumida com base em referências oficiais aplicáveis ao tipo de serviço. O escopo específico desta proposta e as condições expressamente contratadas prevalecem sobre a descrição geral.';
   const refl=doc.splitTextToSize(ref,W-2*M);ensure(refl.length*3.8+2);doc.text(refl,M,y);y+=refl.length*3.8;
   footer();

   const filename='PROPOSTA_LANG_'+pdfSafeName(client.name||b.title)+'_'+today()+'.pdf';
   doc.save(filename);toast('PDF baixado');
 }catch(err){console.error(err);alert('Não foi possível gerar o PDF: '+(err.message||err))}
}

     document:$('#bNewClientDocument').value.trim(),
     phone:$('#bNewClientPhone').value.trim(),

   };
   let selectedClientId=$('#bClient').value;

     }
     const obj={...baseObj,clientId};
     if(b){Object.assign(d.budgets.find(x=>x.id===b.id),obj);logAudit(d,'Orçamento atualizado: '+obj.title)}

   });
 };

function addMonthsDate(dateStr,months){if(!dateStr)return '';const d=new Date(dateStr+'T12:00:00');d.setMonth(d.getMonth()+months);return d.toISOString().slice(0,10)}
function acceptBudget(id){
 const b=state.budgets.find(x=>x.id===id);if(!b)return;if(!confirm('Marcar como aceito, criar o projeto e gerar as parcelas no Financeiro?'))return;
 mutate(d=>{const bb=d.budgets.find(x=>x.id===id);bb.status='Aceito';if(!d.projects.some(p=>p.sourceBudgetId===id)){const pid=uid();const project={id:pid,sourceBudgetId:id,name:bb.title,clientId:bb.clientId,service:bb.service||'Projeto',status:'Planejamento',archived:false,createdAt:new Date().toISOString(),notes:bb.notes||'',stages:makeStages(pid,bb.service),documents:[],approvals:[],history:[{id:uid(),at:new Date().toISOString(),message:'Projeto criado a partir do orçamento aceito'}]};d.projects.push(project);bb.sourceProjectId=pid;const n=Math.max(1,Number(bb.installments||1));const cents=Math.round(Number(bb.value||0)*100),base=Math.floor(cents/n),rest=cents-base*n;for(let i=0;i<n;i++){const value=(base+(i<rest?1:0))/100;if(value<=0)continue;d.finance.push({id:uid(),projectId:pid,clientId:bb.clientId,type:'A receber',description:n>1?`Parcela ${i+1}/${n} - Honorários do projeto`:'Honorários do projeto',value,date:today(),dueDate:addMonthsDate(bb.firstDueDate||'',i),notes:'Gerado a partir do orçamento aceito',reimbursed:false,voided:false})}}});
}

const STAGE_TEMPLATES_AUDIT={

  desdobro:['Solicitar matrícula e documentos','Levantamento / medição','Elaboração do desdobro','Memorial e peças técnicas','Protocolo e acompanhamento na Prefeitura','Atendimento de exigências','Averbação / registro'],
  retificacao:['Solicitar matrícula e documentos','Levantamento topográfico','Processamento e conferência','Planta e memorial descritivo','Coleta de anuências quando aplicável','Protocolo e acompanhamento','Atendimento de exigências','Registro / entrega'],

  generic:['Briefing e levantamento','Desenvolvimento do projeto','Revisão e compatibilização','Aprovação / protocolo','Entrega final']
};

function stageTitlesFor(service=''){
  const t=String(service||'').toLowerCase();
  if(t.includes('preventivo')||t.includes('incênd')||t.includes('ppci'))return STAGE_TEMPLATES_AUDIT.preventivo;
  if(t.includes('retifica')&&t.includes('desdobro'))return STAGE_TEMPLATES_AUDIT.retificacao;
  if(t.includes('retifica'))return STAGE_TEMPLATES_AUDIT.retificacao;
  if(t.includes('desdobro'))return STAGE_TEMPLATES_AUDIT.desdobro;
  if(t.includes('topogr')||t.includes('levantamento'))return STAGE_TEMPLATES_AUDIT.topografia;
  if(t.includes('muro')||t.includes('contenção')||t.includes('contens'))return STAGE_TEMPLATES_AUDIT.muro;
  if(t.includes('instituição')||t.includes('condomínio'))return STAGE_TEMPLATES_AUDIT.condominio;
  if(t.includes('aprovação'))return STAGE_TEMPLATES_AUDIT.aprovacao;
  if(/residencial|regulariza|casa|edifica|arquitet|multifamiliar/.test(t))return STAGE_TEMPLATES_AUDIT.edificacao;
  return STAGE_TEMPLATES_AUDIT.generic;
}

function normalize(s){
  s=s||{};
  ensureChromeProjects(s);
  s.version=3;
  s.revision=Number(s.revision||0);
  s.updatedAt=s.updatedAt||new Date().toISOString();
  for(const k of ['clients','projects','budgets','processes','tasks','finance','audit'])s[k]=Array.isArray(s[k])?s[k]:[];
  s.clients.forEach(c=>{c.phone=c.phone||'';c.email=c.email||'';c.document=c.document||'';c.address=c.address||'';c.notes=c.notes||''});
  s.projects.forEach(p=>{
    p.archived=!!p.archived;
    p.status=p.status||'Planejamento';
    p.documents=Array.isArray(p.documents)?p.documents:[];
    p.approvals=Array.isArray(p.approvals)?p.approvals:[];
    p.history=Array.isArray(p.history)?p.history:[];
    if(p.recoveryPending){p.stages=Array.isArray(p.stages)?p.stages:[]}
    else if(!Array.isArray(p.stages)||!p.stages.length)p.stages=makeStages(p.id,p.service);
    p.address=p.address||'';p.responsible=p.responsible||'';p.startDate=p.startDate||'';p.deadline=p.deadline||'';p.nextAction=p.nextAction||'';p.nextActionDate=p.nextActionDate||'';p.enterprise=p.enterprise||'';p.scope=p.scope||'';p.conditions=p.conditions||'';
  });
  s.budgets.forEach(b=>{
    b.items=Array.isArray(b.items)?b.items:[];b.installments=Array.isArray(b.installments)?b.installments:[];b.scope=b.scope||'';b.conditions=b.conditions||'';b.enterprise=b.enterprise||'';b.discount=Number(b.discount||0);b.grossValue=Number(b.grossValue||b.value||0);b.value=Number(b.value||Math.max(0,b.grossValue-b.discount));b.validUntil=b.validUntil||'';b.paymentPlan=b.paymentPlan||'';b.notes=b.notes||'';b.status=b.status||'Rascunho';
  });
  s.processes.forEach(p=>{p.projectId=p.projectId||'';p.responsible=p.responsible||'';p.notes=p.notes||'';p.status=p.status||'Em aberto';p.due=p.due||''});
  s.tasks.forEach(t=>{t.projectId=t.projectId||'';t.notes=t.notes||'';t.status=t.status||'Pendente';t.due=t.due||''});
  s.finance.forEach(f=>{f.value=Number(f.value||0);f.date=f.date||'';f.notes=f.notes||'';f.paymentMethod=f.paymentMethod||'';f.parentReceivableId=f.parentReceivableId||'';f.reimbursed=!!f.reimbursed;f.canceled=!!f.canceled;f.createdAt=f.createdAt||''});
  return s;
}

function logAudit(d,message){
  d.audit=Array.isArray(d.audit)?d.audit:[];
  d.audit.unshift({id:uid(),at:new Date().toISOString(),message});
  if(d.audit.length>300)d.audit.length=300;
}

function activeFinance(arr=state.finance){return (arr||[]).filter(x=>!x.canceled)}
function financeGroupKey(x){return x.projectId?'p:'+x.projectId:(x.clientId?'c:'+x.clientId:'x:'+x.id)}
function receivableSchedule(filterFn=null){
  const arr=activeFinance().filter(x=>!filterFn||filterFn(x));
  const groups={};
  for(const x of arr){const k=financeGroupKey(x);(groups[k]||(groups[k]=[])).push(x)}
  const out=[];
  for(const rows of Object.values(groups)){
    const rec=rows.filter(x=>x.type==='A receber').slice().sort((a,b)=>(a.date||'9999-99-99').localeCompare(b.date||'9999-99-99'));
    let paid=rows.filter(x=>x.type==='Recebimento').reduce((a,x)=>a+Number(x.value||0),0);
    for(const r of rec){const amount=Number(r.value||0),used=Math.min(amount,paid);paid-=used;out.push({...r,remaining:Math.max(0,amount-used)})}
  }
  return out;
}
function clientBalance(clientId){return receivableSchedule(x=>x.clientId===clientId).reduce((a,x)=>a+x.remaining,0)}
function projectFinanceSummary(projectId){
  const arr=activeFinance().filter(x=>x.projectId===projectId);
  const contracted=arr.filter(x=>x.type==='A receber').reduce((a,x)=>a+Number(x.value||0),0);
  const received=arr.filter(x=>x.type==='Recebimento').reduce((a,x)=>a+Number(x.value||0),0);
  const reimb=arr.filter(x=>x.type==='Reembolso'&&!x.reimbursed).reduce((a,x)=>a+Number(x.value||0),0);
  const expense=arr.filter(x=>x.type==='Despesa').reduce((a,x)=>a+Number(x.value||0),0);
  return {contracted,received,receivable:Math.max(0,contracted-received),reimb,expense};
}
function financeSums(){
  const arr=activeFinance(),received=arr.filter(x=>x.type==='Recebimento').reduce((a,x)=>a+Number(x.value||0),0),contracted=arr.filter(x=>x.type==='A receber').reduce((a,x)=>a+Number(x.value||0),0),schedule=receivableSchedule(),receivable=schedule.reduce((a,x)=>a+x.remaining,0),overdue=schedule.filter(x=>x.remaining>0&&x.date&&x.date<today()).reduce((a,x)=>a+x.remaining,0),undated=schedule.filter(x=>x.remaining>0&&!x.date).reduce((a,x)=>a+x.remaining,0),reimb=arr.filter(x=>x.type==='Reembolso'&&!x.reimbursed).reduce((a,x)=>a+Number(x.value||0),0),expense=arr.filter(x=>x.type==='Despesa').reduce((a,x)=>a+Number(x.value||0),0);
  return {received,contracted,receivable,overdue,undated,reimb,expense};
}
function financeProjection(){
  const rows=receivableSchedule().filter(x=>x.remaining>0),map={};
  for(const x of rows){let key='Sem data';if(x.date)key=x.date<today()?'Vencido':x.date.slice(0,7);map[key]=(map[key]||0)+x.remaining}
  const monthLabel=k=>{if(k==='Vencido'||k==='Sem data')return k;const [y,m]=k.split('-');return new Date(Number(y),Number(m)-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'})};
  return Object.entries(map).sort((a,b)=>{const order=x=>x[0]==='Vencido'?'0000':x[0]==='Sem data'?'9999':x[0];return order(a).localeCompare(order(b))}).map(([k,v])=>({key:k,label:monthLabel(k),value:v}));
}

}

}


let financeScreenTab='summary';
let financeSelectedYear=2026;
let financeSelectedMonth='09';

function financeActiveRows(){
  return (state.finance||[]).filter(x=>!x.canceled&&!x.voided);
}
function financeDueKey(x){
  return x.dueDate||x.date||'';
}
function financeReceivedMonth(x){
  if(x.receivedMonth)return x.receivedMonth;
  const d=x.date||'';
  return /^\d{4}-\d{2}/.test(d)?d.slice(0,7):'';
}
function financePendingRows(){
  const rows=financeActiveRows();
  const receivables=rows.filter(x=>x.type==='A receber').slice().sort((a,b)=>(xSort(a)).localeCompare(xSort(b)));
  const paidByKey={};
  const key=x=>x.projectId?'p:'+x.projectId:(x.clientId?'c:'+x.clientId:'');
  rows.filter(x=>x.type==='Recebimento'&&!x.legacyAggregate).forEach(x=>{
    const k=key(x);if(k)paidByKey[k]=(paidByKey[k]||0)+Number(x.value||0);
  });
  return receivables.map(x=>{
    const k=key(x),available=k?(paidByKey[k]||0):0,amount=Number(x.value||0),used=Math.min(amount,available);
    if(k)paidByKey[k]=Math.max(0,available-used);
    return {...x,remaining:Math.max(0,amount-used)};
  }).filter(x=>x.remaining>0.005);
}
function xSort(x){return x.dueDate||x.date||x.createdAt||'9999-99-99'}
function financeRecoveredMetrics(){
  const rows=financeActiveRows(),pending=financePendingRows();
  const received=rows.filter(x=>x.type==='Recebimento').reduce((a,x)=>a+Number(x.value||0),0);
  const receivable=pending.reduce((a,x)=>a+x.remaining,0);
  const overdue=pending.filter(x=>x.legacyOverdue||(financeDueKey(x)&&financeDueKey(x)<today())).reduce((a,x)=>a+x.remaining,0);
  const undated=pending.filter(x=>!x.projectionMonth&&!financeDueKey(x)&&!x.legacyOverdue).reduce((a,x)=>a+x.remaining,0);
  const reimb=rows.filter(x=>x.type==='Reembolso'&&!x.reimbursed).reduce((a,x)=>a+Number(x.value||0),0);
  const expense=rows.filter(x=>x.type==='Despesa').reduce((a,x)=>a+Number(x.value||0),0);
  return {rows,pending,received,receivable,overdue,undated,reimb,expense};
}
function financeMonthLabel(ym){
  if(!ym)return 'Sem Data Prevista';
  const [y,m]=ym.split('-');
  return new Date(Number(y),Number(m)-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'}).replace(/^./,s=>s.toUpperCase());
}
function financeByClientRows(pending){
  const map={};
  pending.forEach(x=>{const k=x.clientId||'sem-cliente';map[k]=(map[k]||0)+x.remaining});
  return Object.entries(map).map(([id,value])=>({id,name:id==='sem-cliente'?'Sem cliente':clientName(id),value})).filter(x=>x.value>0.005).sort((a,b)=>a.name.localeCompare(b.name,'pt-BR'));
}
function financeProjectionRows(pending){
  const map={};
  pending.forEach(x=>{
    const key=x.projectionMonth||((x.dueDate||x.date||'').slice(0,7))||'';
    if(!map[key])map[key]={value:0,count:0};
    map[key].value+=x.remaining;map[key].count++;
  });
  return Object.entries(map).sort((a,b)=>a[0]===''?1:b[0]===''?-1:a[0].localeCompare(b[0])).map(([month,v])=>({month,...v}));
}
function financeMonthlyReceived(year){
  const months=Array.from({length:12},(_,i)=>String(i+1).padStart(2,'0'));
  return months.map(m=>{
    const key=year+'-'+m;
    const value=financeActiveRows().filter(x=>x.type==='Recebimento'&&financeReceivedMonth(x)===key).reduce((a,x)=>a+Number(x.value||0),0);
    return {key,month:m,value};
  });
}
function financeSummaryTab(){
  const s=financeRecoveredMetrics(),by=financeByClientRows(s.pending),monthly=financeMonthlyReceived(financeSelectedYear);
  const monthKey=financeSelectedYear+'-'+financeSelectedMonth;
  const monthlyReceived=monthly.find(x=>x.key===monthKey)?.value||0;
  const annual=monthly.reduce((a,x)=>a+x.value,0);
  const max=Math.max(1,...monthly.map(x=>x.value));
  const monthNames=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const yearOpts=[2025,2026,2027,2028].map(y=>'<option value="'+y+'" '+(financeSelectedYear===y?'selected':'')+'>'+y+'</option>').join('');
  const monthOpts=monthNames.map((n,i)=>'<option value="'+String(i+1).padStart(2,'0')+'" '+(financeSelectedMonth===String(i+1).padStart(2,'0')?'selected':'')+'>'+n.toLowerCase()+'</option>').join('');
  return '<div class="two"><div class="field"><label>Ano</label><select id="finYear">'+yearOpts+'</select></div><div class="field"><label>Mês</label><select id="finMonth">'+monthOpts+'</select></div></div>'+
    '<div class="meta" style="font-size:16px;margin:6px 0 16px">Faturamento recebido: valores que entraram, conforme a data de cada pagamento. Orçamentos aceitos ainda não pagos ficam em Valores a receber.</div>'+
    '<div class="metrics"><div class="metric"><span>Faturamento mensal</span><strong>'+brl(monthlyReceived)+'</strong><em>'+monthNames[Number(financeSelectedMonth)-1].toLowerCase()+' de '+financeSelectedYear+'</em></div>'+
    '<div class="metric"><span>Faturamento anual</span><strong>'+brl(annual)+'</strong><em>Total recebido em '+financeSelectedYear+'</em></div>'+
    '<div class="metric"><span>Recebimentos em atraso</span><strong>'+brl(s.overdue)+'</strong><em>Saldo com previsão anterior a hoje</em></div></div>'+
    '<div class="card" style="margin-top:16px"><h3>Valores a receber</h3><div style="font-size:34px;font-weight:800;margin:14px 0">'+brl(s.receivable)+'</div><div class="meta" style="margin-bottom:12px">Honorários pendentes de todos os projetos</div>'+
    (by.map(x=>'<div class="finance-client"><span>'+esc(x.name)+'</span><b>'+brl(x.value)+'</b></div>').join('')||'<div class="meta">Nenhum valor pendente.</div>')+'</div>'+
    '<div class="card" style="margin-top:16px"><h3>Reembolsos a receber</h3><div style="font-size:34px;font-weight:800;margin:14px 0">'+brl(s.reimb)+'</div><div class="meta">Despesas pagas pela LANG e ainda não reembolsadas</div>'+(s.reimb?'' : '<div style="margin-top:18px">Nenhum saldo pendente.</div>')+'</div>'+
    '<div class="card" style="margin-top:16px"><h3>Recebimentos mês a mês · '+financeSelectedYear+'</h3>'+
    monthly.map((x,i)=>'<div style="display:grid;grid-template-columns:125px 1fr 105px;gap:12px;align-items:center;padding:10px 0"><span>'+monthNames[i]+'</span><div style="height:10px;border-radius:999px;background:#eceff1;overflow:hidden"><i style="display:block;height:100%;width:'+Math.round(x.value/max*100)+'%;background:var(--accent);border-radius:999px"></i></div><b style="text-align:right">'+brl(x.value)+'</b></div>').join('')+'</div>'+
    '<div class="card" style="margin-top:16px"><h3>Planejamento de entradas</h3><div class="meta" style="font-size:19px;line-height:1.55">'+brl(s.undated)+' a receber ainda sem data prevista.</div><button class="btn primary" style="margin-top:16px;width:100%" data-fin-tab="receivables">Ver valores a receber</button></div>';
}
function financeReceivablesTab(){
  const s=financeRecoveredMetrics(),proj=financeProjectionRows(s.pending),by=financeByClientRows(s.pending);
  return '<div class="metrics"><div class="metric"><span>Total a receber</span><strong>'+brl(s.receivable)+'</strong><em>Todos os valores pendentes</em></div>'+
    '<div class="metric"><span>Previsão vencida</span><strong>'+brl(s.overdue)+'</strong><em>Datas anteriores a hoje</em></div>'+
    '<div class="metric"><span>Ainda sem data</span><strong>'+brl(s.undated)+'</strong><em>Incluído no total a receber</em></div>'+
    '<div class="metric"><span>Já recebido</span><strong>'+brl(s.received)+'</strong><em>Fora da projeção futura</em></div></div>'+
    '<div class="card" style="margin-top:16px"><div class="row-between"><h3>Projeção de recebimentos</h3><span class="meta">Somente valores a receber</span></div>'+
    (proj.map(x=>'<div style="padding:18px 6px;border-top:1px solid #eee"><div class="meta">'+esc(financeMonthLabel(x.month))+'</div><div style="font-size:28px;font-weight:800;margin:7px 0">'+brl(x.value)+'</div><div class="meta">'+x.count+' lançamento(s)</div></div>').join('')||'<div class="meta">Sem previsão cadastrada.</div>')+'</div>'+
    '<div class="card" style="margin-top:16px"><h3>Valores a receber por cliente</h3>'+by.map(x=>'<div class="finance-client"><span>'+esc(x.name)+'</span><b>'+brl(x.value)+'</b></div>').join('')+'</div>';
}
function financeReceiptsTab(){
  const rows=financeActiveRows().filter(x=>x.type==='Recebimento').slice().sort((a,b)=>(financeReceivedMonth(b)||'').localeCompare(financeReceivedMonth(a)||''));
  return '<div class="card"><div class="row-between"><div><h3>Recibos</h3><div class="meta">Recebimentos registrados no LANG Engenharia.</div></div><button class="btn primary sm" id="newReceipt">+ Recebimento</button></div>'+
    (rows.length?rows.map(x=>'<div class="finance-client"><div><b>'+esc(x.description||'Recebimento')+'</b><div class="meta">'+esc(financeReceivedMonth(x)?financeMonthLabel(financeReceivedMonth(x)):(x.date?fmtDate(x.date):'Data individual não recuperada'))+(x.clientId?' · '+esc(clientName(x.clientId)):'')+'</div></div><div style="text-align:right"><b>'+brl(x.value)+'</b>'+(x.legacyAggregate?'<div class="meta">total migrado</div>':'<button class="btn soft sm receipt-fin" data-id="'+x.id+'">Recibo</button>')+'</div></div>').join(''):'<div class="meta">Nenhum recebimento cadastrado.</div>')+'</div>';
}
function renderFinance(){
  const tabButtons='<div class="tabs"><button class="tab '+(financeScreenTab==='summary'?'active':'')+'" data-fin-tab="summary">Resumo</button><button class="tab '+(financeScreenTab==='receivables'?'active':'')+'" data-fin-tab="receivables">Valores a receber</button><button class="tab '+(financeScreenTab==='receipts'?'active':'')+'" data-fin-tab="receipts">Recibos</button></div>';
  const body=financeScreenTab==='summary'?financeSummaryTab():financeScreenTab==='receivables'?financeReceivablesTab():financeReceiptsTab();
  $('#main').innerHTML=pageHead('Financeiro','Faturamento, recebimentos, valores a receber e reembolsos.','<button class="btn primary" id="newFinance">+ Lançamento</button>')+tabButtons+body;
  $('#newFinance').onclick=()=>financeModal();
  document.querySelectorAll('[data-fin-tab]').forEach(b=>b.onclick=()=>{financeScreenTab=b.dataset.finTab;renderFinance()});
  if($('#finYear'))$('#finYear').onchange=e=>{financeSelectedYear=Number(e.target.value);renderFinance()};
  if($('#finMonth'))$('#finMonth').onchange=e=>{financeSelectedMonth=e.target.value;renderFinance()};
  if($('#newReceipt'))$('#newReceipt').onclick=()=>financeModal(null,'','Recebimento');
  document.querySelectorAll('.receipt-fin').forEach(b=>b.onclick=()=>printReceipt(b.dataset.id));
}


function projectFinanceSummary(projectId){
  const rows=financeActiveRows().filter(x=>x.projectId===projectId);
  const contracted=rows.filter(x=>x.type==='A receber').reduce((a,x)=>a+Number(x.value||0),0);
  const received=rows.filter(x=>x.type==='Recebimento').reduce((a,x)=>a+Number(x.value||0),0);
  const reimb=rows.filter(x=>x.type==='Reembolso'&&!x.reimbursed).reduce((a,x)=>a+Number(x.value||0),0);
  const expense=rows.filter(x=>x.type==='Despesa').reduce((a,x)=>a+Number(x.value||0),0);
  return {contracted,received,receivable:Math.max(0,contracted-received),reimb,expense};
}

function backupModal(){
  modal('Backup e restauração','<div class="stack"><button class="btn primary" id="exportBackup">Exportar backup JSON</button><label class="btn soft" style="text-align:center">Importar backup JSON<input id="importBackup" type="file" accept="application/json,.json" style="display:none"></label><button class="btn soft" id="restorePrev">Restaurar versão anterior automática</button></div><div class="login-note">O backup exportado contém os dados do app em formato legível. Guarde-o em local seguro.</div>');
  $('#exportBackup').onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='LANG_GESTAO_BACKUP_'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
  $('#importBackup').onchange=async e=>{const file=e.target.files?.[0];if(!file)return;try{const data=normalize(JSON.parse(await file.text()));if(!confirm('Importar este backup e substituir os dados atuais do LANG Engenharia?'))return;data.revision=Number(data.revision||0)+1;data.updatedAt=new Date().toISOString();await putBlob(await encryptData(data,currentPassword));state=data;closeModal();render();toast('Backup importado')}catch(err){alert('Backup inválido: '+(err.message||err))}};
  $('#restorePrev').onclick=async()=>{if(!confirm('Restaurar a versão imediatamente anterior do banco?'))return;try{const r=await fetch(API+'?id='+encodeURIComponent(DB_ID)+'&version=prev',{cache:'no-store'}),j=await r.json();if(!r.ok)throw new Error(j.error||'Backup anterior não encontrado');const data=normalize(await decryptData(j,currentPassword));data.revision=Number(data.revision||0)+1;data.updatedAt=new Date().toISOString();await putBlob(await encryptData(data,currentPassword));state=data;closeModal();render();toast('Versão anterior restaurada')}catch(err){alert(err.message||'Não foi possível restaurar')}};
}

(function installAuditControls(){
  const actions=document.querySelector('.top-actions');
  if(actions&&!document.getElementById('backupBtn')){const b=document.createElement('button');b.id='backupBtn';b.className='iconbtn';b.textContent='Backup';b.onclick=backupModal;actions.insertBefore(b,document.getElementById('logoutBtn'))}
})();


$('#loginBtn').onclick=doLogin;$('#passwordInput').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});$('#logoutBtn').onclick=logout;$('#refreshBtn').onclick=async()=>{try{await load();render();toast('Dados atualizados')}catch(e){alert(e.message)}};

if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
const saved=sessionStorage.getItem('langPwd');if(saved){$('#passwordInput').value=saved;doLogin()}
})();
