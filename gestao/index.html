<style>
:root{--bg:#f4f3f1;--card:#fff;--ink:#181818;--muted:#716d69;--line:#e5e0da;--brand:#171717;--accent:#f25b21;--accent2:#ff7a37;--good:#18815e;--warn:#b06b16;--danger:#ba3c3c;--shadow:0 12px 34px rgba(25,25,25,.08);--r:18px}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}.hidden{display:none!important}button{cursor:pointer}
.login{min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 82% 14%,rgba(242,91,33,.26),transparent 28%),linear-gradient(145deg,#101010,#222)}.login-card{width:min(430px,100%);background:#fff;border-radius:26px;padding:30px;border-top:5px solid var(--accent);box-shadow:0 25px 80px rgba(0,0,0,.34)}.login-logo{margin:0 0 20px}.login-logo img{width:235px;max-width:80vw;height:auto;display:block}.login h1{font-size:25px;margin:0 0 7px}.login p{color:var(--muted);margin:0 0 20px;line-height:1.5}.login-note{font-size:12px;color:#7b7772;line-height:1.45;margin-top:14px}.error{background:#fff1f1;border:1px solid #ffd0d0;color:#9f2f2f;padding:10px 12px;border-radius:11px;font-size:13px;margin-bottom:12px}
.field{display:grid;gap:7px;margin-bottom:13px}.field label{font-size:12px;font-weight:800;color:#48433f}.field input,.field select,.field textarea{width:100%;border:1px solid #d9d4cf;border-radius:12px;padding:12px 13px;background:#fff;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:#ef8e61;box-shadow:0 0 0 3px rgba(242,91,33,.10)}
.btn{border:0;border-radius:12px;padding:11px 15px;font-weight:850;cursor:pointer}.btn.primary{background:var(--accent);color:#fff}.btn.primary:hover{background:#d94e18}.btn.soft{background:#f2efec;color:var(--ink);border:1px solid #e3ddd7}.btn.dark{background:#1b1b1b;color:#fff}.btn.danger{background:#fff0f0;color:var(--danger)}.btn.good{background:#eaf7f1;color:var(--good)}.btn.full{width:100%}.btn.sm{padding:7px 9px;border-radius:9px;font-size:12px}.stack{display:grid;gap:9px}
.app{min-height:100vh}.topbar{position:sticky;top:0;z-index:30;background:rgba(23,23,23,.98);color:#fff;border-bottom:3px solid var(--accent);padding:8px 12px;display:flex;align-items:center;justify-content:space-between;gap:12px}.top-left{display:flex;align-items:center;gap:9px;min-width:0}.top-logo{background:#fff;border-radius:9px;padding:3px 6px;box-shadow:0 4px 14px rgba(0,0,0,.14)}.top-logo img{width:82px;height:auto;display:block}.top-copy{min-width:0}.top-copy b{display:block;font-size:14px;line-height:1.05}.top-copy span{display:block;font-size:10px;color:#c8c8c8;margin-top:2px}.top-actions{display:flex;align-items:center;gap:6px}.sync{font-size:11px;color:#d2d2d2}.sync.ok{color:#b7e4d3}.sync.bad{color:#ffd0d0}.iconbtn{border:0;background:#2b2b2b;color:#fff;border-radius:10px;padding:8px 10px;font-weight:800}
.layout{display:grid;grid-template-columns:235px 1fr;min-height:calc(100vh - 59px)}.sidebar{background:#1b1b1b;color:#e8e8e8;padding:14px 10px;position:sticky;top:59px;height:calc(100vh - 59px);overflow:auto}.side-title{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:#8f8f8f;padding:9px 10px}.navbtn{width:100%;border:0;background:transparent;color:inherit;text-align:left;padding:11px 12px;border-radius:11px;margin:2px 0;font-weight:750}.navbtn:hover,.navbtn.active{background:#303030;color:#fff}.navbtn.active{box-shadow:inset 3px 0 0 var(--accent)}.navbtn small{display:block;color:#9c9c9c;font-weight:500;margin-top:2px}.mobile-nav{display:none;background:#1b1b1b;padding:8px;gap:6px;overflow:auto;position:sticky;top:57px;z-index:20}.mobile-nav .navbtn{width:auto;white-space:nowrap;border:1px solid #343434;padding:8px 11px;margin:0;font-size:12px}
main{min-width:0;width:100%;max-width:1450px;margin:0 auto;padding:24px}.page-head{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:18px}.page-head h1{margin:0;font-size:28px;letter-spacing:-.02em}.page-head p{margin:5px 0 0;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.breadcrumb{font-size:12px;color:var(--muted);margin-bottom:9px}.search{border:1px solid var(--line);border-radius:12px;background:#fff;padding:10px 12px;min-width:240px}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.metric{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:17px;box-shadow:var(--shadow);overflow:hidden}.metric:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent)}.metric span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:800}.metric strong{display:block;font-size:24px;margin-top:7px}.metric em{display:block;font-style:normal;font-size:12px;color:var(--muted);margin-top:4px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:17px}.card h3{margin:0 0 12px;font-size:17px}.grid-2{display:grid;grid-template-columns:1.15fr .85fr;gap:14px}.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:23px 0 10px}.section-head h3{margin:0;font-size:17px}.section-head p{margin:3px 0 0;color:var(--muted);font-size:12px}.empty{padding:34px;border:1px dashed #d3cdc7;border-radius:16px;background:#fff;text-align:center;color:var(--muted)}
.project-card,.budget-card,.client-card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:15px;box-shadow:var(--shadow)}.project-card{cursor:pointer;transition:.15s transform}.project-card:hover{transform:translateY(-2px);border-color:#f1a17b}.row-between{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.project-card h4,.budget-card h4,.client-card h4{margin:0;font-size:16px}.meta{color:var(--muted);font-size:12px;margin-top:5px;line-height:1.45}.pill{display:inline-flex;align-items:center;border-radius:999px;padding:5px 8px;font-size:10px;font-weight:850;background:#fff0e8;color:#ae4517;border:1px solid #ffd5c2;white-space:nowrap}.pill.good{background:#eaf7f1;color:#187553;border-color:#ccebdc}.pill.gray{background:#f2f2f2;color:#666;border-color:#e5e5e5}.pill.warn{background:#fff5e8;color:#9a5c10;border-color:#ffe0b6}.progress{height:7px;border-radius:999px;background:#eee9e5;overflow:hidden;margin-top:12px}.progress i{display:block;height:100%;background:var(--accent)}.project-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}
.table-wrap{background:#fff;border:1px solid var(--line);border-radius:17px;overflow:hidden;box-shadow:var(--shadow)}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px 13px;border-bottom:1px solid var(--line);font-size:12px;vertical-align:top}th{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:#faf9f8}td.money{font-weight:850;white-space:nowrap}.table-actions{display:flex;gap:5px;flex-wrap:wrap}
.list{display:grid;gap:8px}.list-item{display:flex;justify-content:space-between;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}.list-item b{font-size:13px}.list-item .sub{font-size:11px;color:var(--muted);margin-top:3px}.datebox{min-width:56px;text-align:center;background:#fff0e8;color:#a94318;border:1px solid #ffd5c2;border-radius:11px;padding:7px 6px;font-weight:850;font-size:11px}.overdue .datebox{background:#fff0f0;color:#a63131;border-color:#ffd0d0}
.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:14px}.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 12px;font-size:12px;font-weight:800;white-space:nowrap}.tab.active{background:#1b1b1b;color:#fff;border-color:#1b1b1b}.stage{display:flex;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}.stage:last-child{border-bottom:0}.stage input{width:18px;height:18px;accent-color:var(--accent)}.stage-main{flex:1}.stage-main b{display:block;font-size:13px}.stage-main span{font-size:11px;color:var(--muted)}
.modal-bg{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.58);display:grid;place-items:end center;padding:14px}.modal{width:min(650px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:22px;padding:19px;box-shadow:0 25px 90px rgba(0,0,0,.35)}.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px}.modal-head h3{margin:0}.x{border:0;width:34px;height:34px;border-radius:10px;background:#efedeb;font-size:19px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}.danger-zone{border-top:1px solid var(--line);margin-top:16px;padding-top:14px}.smallprint{font-size:11px;color:var(--muted);line-height:1.45;margin-top:6px}.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:100;background:#171717;color:#fff;padding:11px 14px;border-radius:11px;font-size:12px;box-shadow:var(--shadow)}
.finance-client{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.finance-client:last-child{border-bottom:0}.money.good{color:var(--good)}.money.danger{color:var(--danger)}
@media(max-width:1050px){.metrics{grid-template-columns:repeat(2,1fr)}.grid-3{grid-template-columns:repeat(2,1fr)}.grid-2{grid-template-columns:1fr}}
@media(max-width:820px){.layout{display:block}.sidebar{display:none}.mobile-nav{display:flex}.topbar{top:0}.top-actions .sync{display:none}main{padding:18px 12px 45px}.page-head{display:block}.page-head .actions{margin-top:12px}.search{width:100%;min-width:0}.grid-3{grid-template-columns:1fr}.table-wrap{overflow:visible;background:transparent;border:0;box-shadow:none}table,thead,tbody,tr,th,td{display:block}thead{display:none}tr{background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:8px;padding:9px;box-shadow:0 7px 20px rgba(0,0,0,.04)}td{border:0;padding:4px 5px}td::before{content:attr(data-label);display:inline-block;min-width:100px;color:var(--muted);font-size:10px;font-weight:800}.table-actions{margin-top:7px}}
@media(max-width:560px){.login-card{padding:25px 22px}.top-logo img{width:67px}.top-copy b{font-size:12px}.top-copy span{display:none}.iconbtn{padding:7px 8px;font-size:11px}.metrics{grid-template-columns:1fr 1fr;gap:8px}.metric{padding:13px}.metric strong{font-size:18px}.two{grid-template-columns:1fr}.page-head h1{font-size:24px}.modal-bg{padding:8px}.modal{border-radius:20px}.mobile-nav{top:55px}}
</style>
</head>
<body>
<section id="loginView" class="login">
  <div class="login-card">
    <div class="login-logo"><img src="assets/lang-logo.svg" alt="LANG Engenharia"></div>
    <h1>Gestão de engenharia</h1>
    <p>Acesse o painel interno da LANG Engenharia.</p>
    <div id="loginError" class="error hidden"></div>
    <div class="field"><label>Senha de acesso</label><input id="passwordInput" type="password" autocomplete="current-password" placeholder="Digite a senha"></div>
    <div class="stack"><button id="loginBtn" class="btn primary full">Entrar</button><button id="installBtn" class="btn soft full hidden" type="button">Instalar LANG Engenharia</button></div>
    <div class="login-note">Acesso interno. Os dados ficam sincronizados e criptografados antes do armazenamento.</div>
  </div>
</section>
<section id="appView" class="app hidden">
  <header class="topbar">
    <div class="top-left"><div class="top-logo"><img src="assets/lang-logo.svg" alt="LANG Engenharia"></div><div class="top-copy"><b>LANG Engenharia</b><span>Gestão de engenharia</span></div></div>
    <div class="top-actions"><span id="syncStatus" class="sync">Sincronizado</span><button id="refreshBtn" class="iconbtn">Atualizar</button><button id="logoutBtn" class="iconbtn">Sair</button></div>
  </header>
  <div class="mobile-nav" id="mobileNav"></div>
  <div class="layout"><aside class="sidebar" id="sidebar"></aside><main id="main"></main></div>
</section>
<div id="modalRoot"></div><div id="toast" class="toast hidden"></div>
<script>
(()=>{
'use strict';
const API='/api/lang-gestao-db';
const DB_ID='lang-gestao-51f2807f8f1a4f72aaea1d2c61de8b4e';
const INITIAL_PASSWORD='lang123';
const STAGES=['Briefing e levantamento','Desenvolvimento do projeto','Revisão e compatibilização','Aprovação / protocolo','Entrega final'];
const NAV=[['dashboard','Visão geral','Controle e acompanhamento'],['budgets','Orçamentos','Propostas e conversões'],['projects','Projetos','Execução e etapas'],['processes','Processos','Órgãos e protocolos'],['clients','Clientes','Cadastro e histórico'],['tasks','Tarefas e prazos','Agenda operacional'],['finance','Financeiro','Receber, reembolsar e despesas']];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>\'\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const uid=()=>crypto.randomUUID();
const brl=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const fmtDate=d=>d?new Date(d+'T12:00:00').toLocaleDateString('pt-BR'):'—';
const today=()=>new Date().toISOString().slice(0,10);
let currentPassword='',state=null,currentSection='dashboard',currentProjectId=null,projectTab='overview',deferredInstallPrompt=null;

function seedState(){
 const clients=[
  {id:'cli-atanasio',name:'Atanásio',phone:'',email:'',notes:''},
  {id:'cli-celi',name:'Celi',phone:'',email:'',notes:''},
  {id:'cli-felipe',name:'Felipe Ambrosi',phone:'',email:'',notes:''},
  {id:'cli-cascavel',name:'Cascavel película',phone:'',email:'',notes:''},
  {id:'cli-alexandre',name:'Cliente do Alexandre',phone:'',email:'',notes:'Projeto de terceiro'},
  {id:'cli-jurandir',name:'Jurandir',phone:'',email:'',notes:''},
  {id:'cli-siberia',name:'Sibéria',phone:'',email:'',notes:''}
 ];
 const mk=(id,name,clientId,service)=>({id,name,clientId,service,status:'Planejamento',archived:false,createdAt:'2026-09-26T12:00:00.000Z',notes:'',stages:STAGES.map((title,i)=>({id:id+'-s'+i,title,done:false,due:''}))});
 return {version:1,revision:1,updatedAt:new Date().toISOString(),clients,
 projects:[
  mk('prj-atanasio','Projeto preventivo regularização Atanásio','cli-atanasio','Projeto preventivo / regularização'),
  mk('prj-celi','Desdobro Celi','cli-celi','Desdobro'),
  mk('prj-felipe','Projeto residencial multifamiliar - Felipe Ambrosi','cli-felipe','Projeto residencial multifamiliar'),
  mk('prj-cascavel','Instituição de condomínio Cascavel película','cli-cascavel','Instituição de condomínio'),
  mk('prj-alexandre','Projeto Alexandre cliente terceiro','cli-alexandre','2 casas geminadas'),
  mk('prj-jurandir','Regularização jurandir','cli-jurandir','Regularização de imóvel')
 ],
 budgets:[{id:'bud-siberia',title:'Medir terreno Sibéria',clientId:'cli-siberia',service:'Medição de terreno',value:0,status:'Rascunho',deadline:'2026-09-28',notes:'',createdAt:'2026-09-26T12:00:00.000Z'}],
 processes:[],
 tasks:[{id:'tsk-siberia',title:'Medir terreno Sibéria',type:'Orçamento',refId:'bud-siberia',clientId:'cli-siberia',due:'2026-09-28',status:'Pendente',notes:''}],
 finance:[]};
}
function normalize(s){
 s=s||{};s.version=1;s.revision=Number(s.revision||0);s.updatedAt=s.updatedAt||new Date().toISOString();
 for(const k of ['clients','projects','budgets','processes','tasks','finance'])s[k]=Array.isArray(s[k])?s[k]:[];
 s.projects.forEach(p=>{p.stages=Array.isArray(p.stages)?p.stages:STAGES.map((title,i)=>({id:p.id+'-s'+i,title,done:false,due:''}));p.archived=!!p.archived;p.status=p.status||'Planejamento'});
 return s;
}
function clientName(id){return state.clients.find(x=>x.id===id)?.name||'Sem cliente'}
function toast(msg){const e=$('#toast');e.textContent=msg;e.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.add('hidden'),2500)}
function status(msg,type=''){const e=$('#syncStatus');if(!e)return;e.textContent=msg;e.className='sync '+type}
function buf64(buf){return btoa(String.fromCharCode(...new Uint8Array(buf)))}
function unbuf64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}
async function derive(password,salt){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:180000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function encryptData(data,password){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),key=await derive(password,salt);const plain=new TextEncoder().encode(JSON.stringify(data));const cipher=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,plain);return {app:'lang-engenharia-gestao-v1',salt:buf64(salt),iv:buf64(iv),data:buf64(cipher)}}
async function decryptData(payload,password){if(!payload||payload.app!=='lang-engenharia-gestao-v1')throw new Error('Banco inválido');const salt=unbuf64(payload.salt),iv=unbuf64(payload.iv),key=await derive(password,salt);const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,unbuf64(payload.data));return JSON.parse(new TextDecoder().decode(plain))}
async function fetchBlob(){const r=await fetch(API+'?id='+encodeURIComponent(DB_ID),{cache:'no-store'});const j=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(j.error||'Não foi possível carregar os dados');e.status=r.status;throw e}return j}
async function putBlob(payload){const r=await fetch(API+'?id='+encodeURIComponent(DB_ID),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Não foi possível salvar os dados')}
async function load(){status('Sincronizando…');try{const p=await fetchBlob();state=normalize(await decryptData(p,currentPassword))}catch(e){if(e.status===404&&currentPassword===INITIAL_PASSWORD){state=normalize(seedState());await putBlob(await encryptData(state,currentPassword))}else throw e}status('Sincronizado','ok')}
async function mutate(fn){status('Salvando…');try{let remote;try{remote=normalize(await decryptData(await fetchBlob(),currentPassword))}catch(e){if(e.status===404)remote=normalize(seedState());else throw e}await fn(remote);remote.revision=Number(remote.revision||0)+1;remote.updatedAt=new Date().toISOString();await putBlob(await encryptData(remote,currentPassword));state=remote;status('Sincronizado','ok');render();toast('Alteração salva')}catch(e){status('Erro ao salvar','bad');alert(e.message||'Não foi possível salvar')}}
async function doLogin(){const pwd=$('#passwordInput').value;if(!pwd)return loginErr('Digite a senha.');try{currentPassword=pwd;await load();sessionStorage.setItem('langPwd',pwd);$('#loginView').classList.add('hidden');$('#appView').classList.remove('hidden');buildNav();render()}catch(e){currentPassword='';loginErr('Senha incorreta ou dados indisponíveis.')}}
function loginErr(t){const e=$('#loginError');e.textContent=t;e.classList.remove('hidden')}
function logout(){sessionStorage.removeItem('langPwd');currentPassword='';state=null;$('#appView').classList.add('hidden');$('#loginView').classList.remove('hidden');$('#passwordInput').value='';$('#loginError').classList.add('hidden')}
function buildNav(){const html=`<div class="side-title">Espaço de trabalho</div>`+NAV.map(([id,label,sub])=>`<button class="navbtn ${currentSection===id?'active':''}" data-nav="${id}">${label}<small>${sub}</small></button>`).join('');$('#sidebar').innerHTML=html;$('#mobileNav').innerHTML=NAV.map(([id,label])=>`<button class="navbtn ${currentSection===id?'active':''}" data-nav="${id}">${label}</button>`).join('');document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{currentSection=b.dataset.nav;currentProjectId=null;buildNav();render()})}
function pageHead(title,sub,buttons=''){return `<div class="page-head"><div><div class="breadcrumb">Meu escritório / ${esc(title)}</div><h1>${esc(title)}</h1><p>${esc(sub)}</p></div><div class="actions">${buttons}</div></div>`}
function progress(p){const done=p.stages.filter(s=>s.done).length,total=p.stages.length||1;return Math.round(done/total*100)}
function projectCard(p){const pc=progress(p);return `<article class="project-card" data-project="${p.id}"><div class="row-between"><div><h4>${esc(p.name)}</h4><div class="meta">${esc(clientName(p.clientId))}<br>${esc(p.service||'Projeto')}</div></div><span class="pill ${p.archived?'gray':''}">${esc(p.archived?'Concluído':p.status)}</span></div><div class="progress"><i style="width:${pc}%"></i></div><div class="project-foot"><span>${pc}% das etapas</span><b>${p.stages.filter(s=>s.done).length}/${p.stages.length}</b></div></article>`}

function renderDashboard(){const active=state.projects.filter(p=>!p.archived),openProc=state.processes.filter(p=>!['Concluído','Arquivado'].includes(p.status)).length,openBud=state.budgets.filter(b=>!['Aceito','Recusado'].includes(b.status)).length,over=state.tasks.filter(t=>t.status!=='Concluída'&&t.due&&t.due<today()).length;const upcoming=state.tasks.filter(t=>t.status!=='Concluída').slice().sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999')).slice(0,6);$('#main').innerHTML=`${pageHead('Visão geral','Cada projeto no rumo certo.','<button class="btn primary" id="quickBudget">Novo orçamento</button>')}<div class="metrics"><div class="metric"><span>Projetos ativos</span><strong>${active.length.toString().padStart(2,'0')}</strong><em>em execução</em></div><div class="metric"><span>Processos em aberto</span><strong>${openProc.toString().padStart(2,'0')}</strong><em>acompanhamento externo</em></div><div class="metric"><span>Orçamentos em aberto</span><strong>${openBud.toString().padStart(2,'0')}</strong><em>propostas em andamento</em></div><div class="metric"><span>Prazos vencidos</span><strong>${over.toString().padStart(2,'0')}</strong><em>tarefas e orçamentos</em></div></div><div class="grid-2"><section><div class="section-head"><h3>Projetos em andamento</h3><button class="btn soft sm" id="allProjects">Ver todos</button></div><div class="grid-3">${active.slice(0,6).map(projectCard).join('')||'<div class="empty">Nenhum projeto ativo.</div>'}</div></section><section><div class="section-head"><h3>Próximos prazos</h3><button class="btn soft sm" id="allTasks">Ver agenda</button></div><div class="list">${upcoming.map(t=>`<div class="list-item ${t.due&&t.due<today()?'overdue':''}"><div class="datebox">${fmtDate(t.due).slice(0,5)}</div><div style="flex:1"><b>${esc(t.title)}</b><div class="sub">${esc(clientName(t.clientId))} · ${esc(t.type||'Tarefa')} · ${esc(t.status)}</div></div></div>`).join('')||'<div class="empty">Nenhum prazo cadastrado.</div>'}</div></section></div><div class="section-head"><div><h3>Fluxo de trabalho</h3><p>Tudo conectado, do início ao fim.</p></div></div><div class="grid-3"><div class="card"><h3>01 · Prepare o orçamento</h3><div class="meta">Cadastre o serviço, valor e prazo. Ao aceitar, gere o projeto.</div></div><div class="card"><h3>02 · Execute o projeto</h3><div class="meta">Acompanhe etapas, documentos, tarefas e valores.</div></div><div class="card"><h3>03 · Acompanhe o processo</h3><div class="meta">Registre protocolo, órgão, situação e próximos passos.</div></div></div>`;bindProjectCards();$('#quickBudget').onclick=()=>budgetModal();$('#allProjects').onclick=()=>{currentSection='projects';render()};$('#allTasks').onclick=()=>{currentSection='tasks';render()}}
function renderBudgets(){const rows=state.budgets.slice().sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));$('#main').innerHTML=`${pageHead('Orçamentos','Do primeiro contato à aprovação.','<button class="btn primary" id="newBudget">+ Novo orçamento</button>')}<div class="grid-3">${rows.map(b=>`<article class="budget-card"><div class="row-between"><div><h4>${esc(b.title)}</h4><div class="meta">${esc(clientName(b.clientId))}<br>${esc(b.service||'Serviço')}</div></div><span class="pill ${b.status==='Aceito'?'good':b.status==='Rascunho'?'gray':'warn'}">${esc(b.status)}</span></div><div class="project-foot"><span>${b.deadline?'Prazo '+fmtDate(b.deadline):'Sem prazo'}</span><b>${brl(b.value)}</b></div><div class="actions" style="margin-top:10px"><button class="btn soft sm edit-budget" data-id="${b.id}">Editar</button>${b.status!=='Aceito'?`<button class="btn good sm accept-budget" data-id="${b.id}">Aceitar e criar projeto</button>`:''}</div></article>`).join('')||'<div class="empty">Nenhum orçamento cadastrado.</div>'}</div>`;$('#newBudget').onclick=()=>budgetModal();document.querySelectorAll('.edit-budget').forEach(b=>b.onclick=()=>budgetModal(b.dataset.id));document.querySelectorAll('.accept-budget').forEach(b=>b.onclick=()=>acceptBudget(b.dataset.id))}
function renderProjects(){const active=state.projects.filter(p=>!p.archived),arch=state.projects.filter(p=>p.archived);$('#main').innerHTML=`${pageHead('Projetos','Execução, etapas e acompanhamento.','<button class="btn primary" id="newProject">+ Novo projeto</button>')}<div class="tabs"><button class="tab active" id="tabActive">Ativos (${active.length})</button><button class="tab" id="tabArchived">Concluídos (${arch.length})</button></div><div id="projectsGrid" class="grid-3">${active.map(projectCard).join('')||'<div class="empty">Nenhum projeto ativo.</div>'}</div>`;let showing='active';const draw=()=>{$('#tabActive').classList.toggle('active',showing==='active');$('#tabArchived').classList.toggle('active',showing==='arch');const arr=showing==='active'?active:arch;$('#projectsGrid').innerHTML=arr.map(projectCard).join('')||'<div class="empty">Nenhum projeto nesta categoria.</div>';bindProjectCards()};$('#tabActive').onclick=()=>{showing='active';draw()};$('#tabArchived').onclick=()=>{showing='arch';draw()};$('#newProject').onclick=()=>projectModal()}

 class="btn soft" id="unarchiveProject">Reabrir projeto</button>':''}`)}<div class="metrics"><div class="metric"><span>Status</span><strong style="font-size:18px">${esc(p.archived?'Concluído':p.status)}</strong><em>${pc}% concluído</em></div><div class="metric"><span>Etapas concluídas</span><strong>${p.stages.filter(s=>s.done).length}/${p.stages.length}</strong><em>controle do projeto</em></div><div class="metric"><span>A receber</span><strong>${brl(receivable)}</strong><em>vinculado ao projeto</em></div><div class="metric"><span>Recebido</span><strong>${brl(received)}</strong><em>vinculado ao projeto</em></div></div><div class="tabs">${tabs.map(([k,l])=>`<button class="tab ${projectTab===k?'active':''}" data-ptab="${k}">${l}</button>`).join('')}</div>${body}`;$('#backProjects').onclick=()=>{currentProjectId=null;currentSection='projects';render()};$('#editProject').onclick=()=>projectModal(p.id);document.querySelectorAll('[data-ptab]').forEach(b=>b.onclick=()=>{projectTab=b.dataset.ptab;render()});document.querySelectorAll('.stage-check').forEach(c=>c.onchange=()=>mutate(d=>{const pp=d.projects.find(x=>x.id===p.id),ss=pp.stages.find(x=>x.id===c.dataset.stage);ss.done=c.checked;if(pp.stages.every(x=>x.done))pp.status='Pronto para concluir';else if(pp.stages.some(x=>x.done))pp.status='Em andamento';else pp.status='Planejamento'}));if($('#archiveProject'))$('#archiveProject').onclick=()=>mutate(d=>{const pp=d.projects.find(x=>x.id===p.id);pp.archived=true;pp.status='Concluído'});if($('#unarchiveProject'))$('#unarchiveProject').onclick=()=>mutate(d=>{const pp=d.projects.find(x=>x.id===p.id);pp.archived=false;pp.status='Em andamento'});if($('#newProjectFinance'))$('#newProjectFinance').onclick=()=>financeModal(null,p.id)}

function financeSums(){const sum=t=>state.finance.filter(x=>x.type===t).reduce((a,x)=>a+Number(x.value||0),0);return {received:sum('Recebimento'),receivable:sum('A receber'),reimb:sum('Reembolso'),expense:sum('Despesa')}}

function renderFinance(){const s=financeSums();const receivableBy=state.clients.map(c=>({c,v:state.finance.filter(x=>x.clientId===c.id&&x.type==='A receber').reduce((a,x)=>a+Number(x.value||0),0)})).filter(x=>x.v);const reimbBy=state.clients.map(c=>({c,v:state.finance.filter(x=>x.clientId===c.id&&x.type==='Reembolso').reduce((a,x)=>a+Number(x.value||0),0)})).filter(x=>x.v);$('#main').innerHTML=`${pageHead('Financeiro','Valores recebidos, a receber, reembolsos e despesas.','<button class="btn primary" id="newFinance">+ Lançamento</button>')}<div class="metrics"><div class="metric"><span>Recebido</span><strong>${brl(s.received)}</strong><em>entradas confirmadas</em></div><div class="metric"><span>A receber</span><strong>${brl(s.receivable)}</strong><em>valores pendentes</em></div><div class="metric"><span>Reembolsos</span><strong>${brl(s.reimb)}</strong><em>valores a reembolsar</em></div><div class="metric"><span>Despesas</span><strong>${brl(s.expense)}</strong><em>saídas registradas</em></div></div><div class="grid-2"><div class="card"><h3>A receber por cliente</h3>${receivableBy.map(x=>`<div class="finance-client"><span>${esc(x.c.name)}</span><b>${brl(x.v)}</b></div>`).join('')||'<div class="meta">Nenhum valor pendente.</div>'}</div><div class="card"><h3>Reembolsos por cliente</h3>${reimbBy.map(x=>`<div class="finance-client"><span>${esc(x.c.name)}</span><b>${brl(x.v)}</b></div>`).join('')||'<div class="meta">Nenhum reembolso pendente.</div>'}</div></div><div class="section-head"><h3>Lançamentos</h3></div><div id="financeTable">${financeTable(state.finance)}</div>`;$('#newFinance').onclick=()=>financeModal();document.querySelectorAll('.edit-fin').forEach(b=>b.onclick=()=>financeModal(b.dataset.id))}
function modal(title,body){const root=$('#modalRoot');root.innerHTML=`<div class="modal-bg"><div class="modal"><div class="modal-head"><h3>${esc(title)}</h3><button class="x" id="modalClose">×</button></div>${body}</div></div>`;$('#modalClose').onclick=closeModal;root.querySelector('.modal-bg').onclick=e=>{if(e.target.classList.contains('modal-bg'))closeModal()}}

function clientModal(id=null){const c=id?state.clients.find(x=>x.id===id):null;modal(c?'Editar cliente':'Novo cliente',`<form id="clientForm"><div class="field"><label>Nome *</label><input id="cName" required value="${esc(c?.name||'')}"></div><div class="two"><div class="field"><label>Telefone</label><input id="cPhone" value="${esc(c?.phone||'')}"></div><div class="field"><label>E-mail</label><input id="cEmail" type="email" value="${esc(c?.email||'')}"></div></div><div class="field"><label>Observações</label><textarea id="cNotes" rows="3">${esc(c?.notes||'')}</textarea></div><div class="modal-foot"><button type="button" class="btn soft" id="cancel">Cancelar</button><button class="btn primary">Salvar</button></div>${c?'<div class="danger-zone"><button type="button" class="btn danger" id="deleteClient">Excluir cliente</button><div class="smallprint">A exclusão só será permitida se não houver registros vinculados.</div></div>':''}</form>`);$('#cancel').onclick=closeModal;$('#clientForm').onsubmit=e=>{e.preventDefault();const obj={name:$('#cName').value.trim(),phone:$('#cPhone').value.trim(),email:$('#cEmail').value.trim(),notes:$('#cNotes').value.trim()};if(!obj.name)return;closeModal();mutate(d=>{if(c)Object.assign(d.clients.find(x=>x.id===c.id),obj);else d.clients.push({id:uid(),...obj})})};if(c)$('#deleteClient').onclick=()=>{const linked=state.projects.some(x=>x.clientId===c.id)||state.budgets.some(x=>x.clientId===c.id)||state.processes.some(x=>x.clientId===c.id)||state.tasks.some(x=>x.clientId===c.id)||state.finance.some(x=>x.clientId===c.id);if(linked)return alert('Este cliente possui registros vinculados.');if(confirm('Excluir este cliente?')){closeModal();mutate(d=>{d.clients=d.clients.filter(x=>x.id!==c.id)})}}}
function budgetModal(id=null){const b=id?state.budgets.find(x=>x.id===id):null;modal(b?'Editar orçamento':'Novo orçamento',`<form id="budgetForm"><div class="field"><label>Título *</label><input id="bTitle" required value="${esc(b?.title||'')}"></div><div class="two"><div class="field"><label>Cliente *</label><select id="bClient" required><option value="">Selecione</option>${clientOptions(b?.clientId)}</select></div><div class="field"><label>Serviço</label><input id="bService" value="${esc(b?.service||'')}"></div></div><div class="two"><div class="field"><label>Valor (R$)</label><input id="bValue" type="number" min="0" step="0.01" value="${b?.value||''}"></div><div class="field"><label>Prazo / retorno</label><input id="bDeadline" type="date" value="${b?.deadline||''}"></div></div><div class="two"><div class="field"><label>Status</label><select id="bStatus">${['Rascunho','Enviado','Em negociação','Aceito','Recusado'].map(x=>`<option ${b?.status===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Observações</label><input id="bNotes" value="${esc(b?.notes||'')}"></div></div><div class="modal-foot"><button type="button" class="btn soft" id="cancel">Cancelar</button><button class="btn primary">Salvar</button></div>${b?'<div class="danger-zone"><button type="button" class="btn danger" id="deleteBudget">Excluir orçamento</button></div>':''}</form>`);$('#cancel').onclick=closeModal;$('#budgetForm').onsubmit=e=>{e.preventDefault();const obj={title:$('#bTitle').value.trim(),clientId:$('#bClient').value,service:$('#bService').value.trim(),value:Number($('#bValue').value||0),deadline:$('#bDeadline').value,status:$('#bStatus').value,notes:$('#bNotes').value.trim()};if(!obj.title||!obj.clientId)return;closeModal();mutate(d=>{if(b)Object.assign(d.budgets.find(x=>x.id===b.id),obj);else d.budgets.push({id:uid(),createdAt:new Date().toISOString(),...obj})})};if(b)$('#deleteBudget').onclick=()=>{if(confirm('Excluir este orçamento?')){closeModal();mutate(d=>{d.budgets=d.budgets.filter(x=>x.id!==b.id);d.tasks=d.tasks.filter(x=>x.refId!==b.id)})}}}
function acceptBudget(id){const b=state.budgets.find(x=>x.id===id);if(!b)return;if(!confirm('Marcar como aceito e criar um projeto a partir deste orçamento?'))return;mutate(d=>{const bb=d.budgets.find(x=>x.id===id);bb.status='Aceito';if(!d.projects.some(p=>p.sourceBudgetId===id)){const pid=uid();d.projects.push({id:pid,sourceBudgetId:id,name:bb.title,clientId:bb.clientId,service:bb.service||'Projeto',status:'Planejamento',archived:false,createdAt:new Date().toISOString(),notes:bb.notes||'',stages:STAGES.map((title,i)=>({id:pid+'-s'+i,title,done:false,due:''}))});if(bb.value>0)d.finance.push({id:uid(),projectId:pid,clientId:bb.clientId,type:'A receber',description:'Honorários do projeto',value:Number(bb.value),date:today(),notes:'Gerado a partir do orçamento aceito'})}})}
function projectModal(id=null){const p=id?state.projects.find(x=>x.id===id):null;modal(p?'Editar projeto':'Novo projeto',`<form id="projectForm"><div class="field"><label>Nome do projeto *</label><input id="pName" required value="${esc(p?.name||'')}"></div><div class="two"><div class="field"><label>Cliente *</label><select id="pClient" required><option value="">Selecione</option>${clientOptions(p?.clientId)}</select></div><div class="field"><label>Serviço</label><input id="pService" value="${esc(p?.service||'')}"></div></div><div class="two"><div class="field"><label>Status</label><select id="pStatus">${['Planejamento','Em andamento','Aguardando cliente','Aguardando órgão','Pronto para concluir','Concluído'].map(x=>`<option ${p?.status===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Observações</label><input id="pNotes" value="${esc(p?.notes||'')}"></div></div><div class="modal-foot"><button type="button" class="btn soft" id="cancel">Cancelar</button><button class="btn primary">Salvar</button></div>${p?'<div class="danger-zone"><button type="button" class="btn danger" id="deleteProject">Excluir projeto</button><div class="smallprint">Também serão removidos os lançamentos financeiros vinculados ao projeto.</div></div>':''}</form>`);$('#cancel').onclick=closeModal;$('#projectForm').onsubmit=e=>{e.preventDefault();const obj={name:$('#pName').value.trim(),clientId:$('#pClient').value,service:$('#pService').value.trim(),status:$('#pStatus').value,notes:$('#pNotes').value.trim()};if(!obj.name||!obj.clientId)return;closeModal();mutate(d=>{if(p)Object.assign(d.projects.find(x=>x.id===p.id),obj);else{const pid=uid();d.projects.push({id:pid,archived:false,createdAt:new Date().toISOString(),stages:STAGES.map((title,i)=>({id:pid+'-s'+i,title,done:false,due:''})),...obj})}})};if(p)$('#deleteProject').onclick=()=>{if(confirm('Excluir este projeto?')){closeModal();currentProjectId=null;mutate(d=>{d.projects=d.projects.filter(x=>x.id!==p.id);d.finance=d.finance.filter(x=>x.projectId!==p.id);d.tasks=d.tasks.filter(x=>x.refId!==p.id)})}}}
function processModal(id=null){const p=id?state.processes.find(x=>x.id===id):null;modal(p?'Editar processo':'Novo processo',`<form id="processForm"><div class="field"><label>Nome / assunto *</label><input id="prTitle" required value="${esc(p?.title||'')}"></div><div class="two"><div class="field"><label>Cliente *</label><select id="prClient" required><option value="">Selecione</option>${clientOptions(p?.clientId)}</select></div><div class="field"><label>Órgão</label><input id="prAgency" value="${esc(p?.agency||'')}"></div></div><div class="two"><div class="field"><label>Protocolo</label><input id="prProtocol" value="${esc(p?.protocol||'')}"></div><div class="field"><label>Status</label><select id="prStatus">${['Em aberto','Em análise','Exigência','Aguardando cliente','Aprovado','Concluído','Arquivado'].map(x=>`<option ${p?.status===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="two"><div class="field"><label>Próximo prazo</label><input id="prDue" type="date" value="${p?.due||''}"></div><div class="field"><label>Observações</label><input id="prNotes" value="${esc(p?.notes||'')}"></div></div><div class="modal-foot"><button type="button" class="btn soft" id="cancel">Cancelar</button><button class="btn primary">Salvar</button></div>${p?'<div class="danger-zone"><button type="button" class="btn danger" id="deleteProcess">Excluir processo</button></div>':''}</form>`);$('#cancel').onclick=closeModal;$('#processForm').onsubmit=e=>{e.preventDefault();const obj={title:$('#prTitle').value.trim(),clientId:$('#prClient').value,agency:$('#prAgency').value.trim(),protocol:$('#prProtocol').value.trim(),status:$('#prStatus').value,due:$('#prDue').value,notes:$('#prNotes').value.trim()};if(!obj.title||!obj.clientId)return;closeModal();mutate(d=>{if(p)Object.assign(d.processes.find(x=>x.id===p.id),obj);else d.processes.push({id:uid(),...obj})})};if(p)$('#deleteProcess').onclick=()=>{if(confirm('Excluir este processo?')){closeModal();mutate(d=>{d.processes=d.processes.filter(x=>x.id!==p.id)})}}}
function taskModal(id=null){const t=id?state.tasks.find(x=>x.id===id):null;modal(t?'Editar tarefa':'Nova tarefa',`<form id="taskForm"><div class="field"><label>Tarefa *</label><input id="tTitle" required value="${esc(t?.title||'')}"></div><div class="two"><div class="field"><label>Cliente</label><select id="tClient"><option value="">Sem cliente</option>${clientOptions(t?.clientId)}</select></div><div class="field"><label>Tipo</label><select id="tType">${['Tarefa','Orçamento','Projeto','Processo','Financeiro','Visita','Medição'].map(x=>`<option ${t?.type===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="two"><div class="field"><label>Prazo</label><input id="tDue" type="date" value="${t?.due||''}"></div><div class="field"><label>Status</label><select id="tStatus">${['Pendente','Em andamento','Aguardando','Concluída'].map(x=>`<option ${t?.status===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="field"><label>Observações</label><textarea id="tNotes" rows="3">${esc(t?.notes||'')}</textarea></div><div class="modal-foot"><button type="button" class="btn soft" id="cancel">Cancelar</button><button class="btn primary">Salvar</button></div>${t?'<div class="danger-zone"><button type="button" class="btn danger" id="deleteTask">Excluir tarefa</button></div>':''}</form>`);$('#cancel').onclick=closeModal;$('#taskForm').onsubmit=e=>{e.preventDefault();const obj={title:$('#tTitle').value.trim(),clientId:$('#tClient').value,type:$('#tType').value,due:$('#tDue').value,status:$('#tStatus').value,notes:$('#tNotes').value.trim()};if(!obj.title)return;closeModal();mutate(d=>{if(t)Object.assign(d.tasks.find(x=>x.id===t.id),obj);else d.tasks.push({id:uid(),...obj})})};if(t)$('#deleteTask').onclick=()=>{if(confirm('Excluir esta tarefa?')){closeModal();mutate(d=>{d.tasks=d.tasks.filter(x=>x.id!==t.id)})}}}
function financeModal(id=null,projectId=''){const f=id?state.finance.find(x=>x.id===id):null;modal(f?'Editar lançamento':'Novo lançamento',`<form id="financeForm"><div class="two"><div class="field"><label>Tipo *</label><select id="fType">${['Recebimento','A receber','Reembolso','Despesa'].map(x=>`<option ${f?.type===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Data</label><input id="fDate" type="date" value="${f?.date||today()}"></div></div><div class="two"><div class="field"><label>Cliente *</label><select id="fClient" required><option value="">Selecione</option>${clientOptions(f?.clientId||(projectId?state.projects.find(p=>p.id===projectId)?.clientId:''))}</select></div><div class="field"><label>Projeto</label><select id="fProject"><option value="">Sem projeto</option>${state.projects.map(p=>`<option value="${p.id}" ${(f?.projectId||projectId)===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div></div><div class="field"><label>Descrição *</label><input id="fDesc" required value="${esc(f?.description||'')}"></div><div class="two"><div class="field"><label>Valor (R$) *</label><input id="fValue" type="number" min="0.01" step="0.01" required value="${f?.value||''}"></div><div class="field"><label>Observações</label><input id="fNotes" value="${esc(f?.notes||'')}"></div></div><div class="modal-foot"><button type="button" class="btn soft" id="cancel">Cancelar</button><button class="btn primary">Salvar</button></div>${f?'<div class="danger-zone"><button type="button" class="btn danger" id="deleteFinance">Excluir lançamento</button></div>':''}</form>`);$('#cancel').onclick=closeModal;$('#financeForm').onsubmit=e=>{e.preventDefault();const obj={type:$('#fType').value,date:$('#fDate').value,clientId:$('#fClient').value,projectId:$('#fProject').value,description:$('#fDesc').value.trim(),value:Number($('#fValue').value),notes:$('#fNotes').value.trim()};if(!obj.clientId||!obj.description||!obj.value)return;closeModal();mutate(d=>{if(f)Object.assign(d.finance.find(x=>x.id===f.id),obj);else d.finance.push({id:uid(),...obj})})};if(f)$('#deleteFinance').onclick=()=>{if(confirm('Excluir este lançamento?')){closeModal();mutate(d=>{d.finance=d.finance.filter(x=>x.id!==f.id)})}}}

$('#loginBtn').onclick=doLogin;$('#passwordInput').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});$('#logoutBtn').onclick=logout;$('#refreshBtn').onclick=async()=>{try{await load();render();toast('Dados atualizados')}catch(e){alert(e.message)}};
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstallPrompt=e;$('#installBtn').classList.remove('hidden')});$('#installBtn').onclick=async()=>{if(!deferredInstallPrompt)return;deferredInstallPrompt.prompt();try{await deferredInstallPrompt.userChoice}catch(_){}deferredInstallPrompt=null;$('#installBtn').classList.add('hidden')};window.addEventListener('appinstalled',()=>$('#installBtn').classList.add('hidden'));
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
const saved=sessionStorage.getItem('langPwd');if(saved){$('#passwordInput').value=saved;doLogin()}
})();
