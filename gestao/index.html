function normalize(s){
 s=s||{};s.version=2;s.revision=Number(s.revision||0);s.updatedAt=s.updatedAt||new Date().toISOString();
 for(const k of ['clients','projects','budgets','processes','tasks','finance'])s[k]=Array.isArray(s[k])?s[k]:[];
 s.projects.forEach(p=>{
   p.archived=!!p.archived;p.status=p.status||'Planejamento';p.documents=Array.isArray(p.documents)?p.documents:[];p.approvals=Array.isArray(p.approvals)?p.approvals:[];p.history=Array.isArray(p.history)?p.history:[];
   if(p.recoveryPending){p.stages=Array.isArray(p.stages)?p.stages:[]}
   else if(!Array.isArray(p.stages)||!p.stages.length)p.stages=makeStages(p.id,p.service);
   else {
     const isGeneric=p.stages.length===STAGES.length&&p.stages.every((x,i)=>x.title===STAGES[i])&&p.stages.every(x=>!x.done&&!x.due);
     if(isGeneric){const titles=stageTitlesFor(p.service);p.stages=titles.map((title,i)=>({id:p.id+'-s'+i,title,done:false,due:''}))}
   }
   p.address=p.address||'';p.responsible=p.responsible||'';p.startDate=p.startDate||'';p.deadline=p.deadline||'';p.nextAction=p.nextAction||'';p.nextActionDate=p.nextActionDate||'';
 });
 return s;
}

function buf64(buf){return btoa(String.fromCharCode(...new Uint8Array(buf)))}
function unbuf64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}

async function decryptData(payload,password){if(!payload||payload.app!=='lang-engenharia-gestao-v1')throw new Error('Banco inválido');const salt=unbuf64(payload.salt),iv=unbuf64(payload.iv),key=await derive(password,salt);const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,unbuf64(payload.data));return JSON.parse(new TextDecoder().decode(plain))}

function liveFinance(arr=state.finance){return (arr||[]).filter(x=>!x.voided)}
function pendingReceivableRows(arr=state.finance){
 const live=liveFinance(arr),receipts={};
 const key=x=>x.projectId||('client:'+String(x.clientId||''));
 live.filter(x=>x.type==='Recebimento').forEach(x=>{const k=key(x);receipts[k]=(receipts[k]||0)+Number(x.value||0)});
 const rows=live.filter(x=>x.type==='A receber').slice().sort((a,b)=>(a.dueDate||a.date||'9999').localeCompare(b.dueDate||b.date||'9999'));
 return rows.map(x=>{const k=key(x),available=receipts[k]||0,applied=Math.min(available,Number(x.value||0)),remaining=Math.max(0,Number(x.value||0)-applied);receipts[k]=Math.max(0,available-applied);return {...x,remaining}}).filter(x=>x.remaining>0.005);
}
function financeSummaryFor(arr=state.finance){
 const live=liveFinance(arr),pending=pendingReceivableRows(arr);
 const received=live.filter(x=>x.type==='Recebimento').reduce((a,x)=>a+Number(x.value||0),0);
 const contracted=live.filter(x=>x.type==='A receber').reduce((a,x)=>a+Number(x.value||0),0);
 const reimb=live.filter(x=>x.type==='Reembolso'&&!x.reimbursed).reduce((a,x)=>a+Number(x.value||0),0);
 const expense=live.filter(x=>x.type==='Despesa').reduce((a,x)=>a+Number(x.value||0),0);
 const receivable=pending.reduce((a,x)=>a+x.remaining,0);
 const overdue=pending.filter(x=>x.dueDate&&x.dueDate<today()).reduce((a,x)=>a+x.remaining,0);
 const undated=pending.filter(x=>!x.dueDate).reduce((a,x)=>a+x.remaining,0);
 return {received,contracted,receivable,reimb,expense,overdue,undated,pending};
}
function financeSums(){return financeSummaryFor(state.finance)}
function projectFinanceSummary(projectId){return financeSummaryFor(state.finance.filter(x=>x.projectId===projectId))}

 return rows.length?`<div class="table-wrap"><table><thead><tr><th>Data</th><th>Vencimento</th><th>Tipo</th><th>Cliente</th><th>Projeto</th><th>Descrição</th><th>Valor</th><th>Ações</th></tr></thead><tbody>${rows.map(x=>`<tr style="${x.voided?'opacity:.55;text-decoration:line-through':''}"><td data-label="Data">${fmtDate(x.date)}</td><td data-label="Vencimento">${x.dueDate?fmtDate(x.dueDate):'—'}</td><td data-label="Tipo"><span class="pill ${x.type==='Recebimento'||(x.type==='Reembolso'&&x.reimbursed)?'good':x.type==='Despesa'?'warn':''}">${esc(x.type)}${x.type==='Reembolso'&&x.reimbursed?' · reembolsado':''}${x.voided?' · estornado':''}</span></td><td data-label="Cliente">${esc(clientName(x.clientId))}</td><td data-label="Projeto">${esc(projectName(x.projectId))}</td><td data-label="Descrição">${esc(x.description||'—')}${x.voided&&x.voidReason?`<div class="meta">Motivo: ${esc(x.voidReason)}</div>`:''}</td><td data-label="Valor" class="money">${brl(x.value)}</td><td data-label="Ações"><div class="table-actions"><button class="btn soft sm edit-fin" data-id="${x.id}" ${x.voided?'disabled':''}>Editar</button>${x.type==='Recebimento'&&!x.voided?`<button class="btn soft sm receipt-fin" data-id="${x.id}">Recibo</button>`:''}${x.type==='Reembolso'&&!x.voided?`<button class="btn good sm toggle-reimb" data-id="${x.id}">${x.reimbursed?'Reabrir reembolso':'Valor reembolsado'}</button>`:''}${x.voided?`<button class="btn soft sm reopen-fin" data-id="${x.id}">Reabrir</button>`:`<button class="btn danger sm void-fin" data-id="${x.id}">Estornar</button>`}</div></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Nenhum lançamento financeiro.</div>';

te(d=>{d.budgets=d.budgets.filter(x=>x.id!==b.id);d.tasks=d.tasks.filter(x=>x.refId!==b.id)})}}}

/* ===== PENTE-FINO LANG ENGENHARIA: recursos recuperados da versão anterior ===== */
const LANG_SERVICE_TYPES=[
 'Levantamento topográfico',
 'Projeto residencial unifamiliar',
 'Projeto residencial multifamiliar',
 'Projeto comercial',
 'Projeto preventivo contra incêndio',
 'Projeto hidrossanitário',
 'Projeto elétrico',
 'Projeto estrutural',
 'Muro de contenção',
 'Retificação de área',
 'Desdobro',
 'Instituição de condomínio',
 'Incorporação imobiliária',
 'Averbação',
 'Galpão'
];
let financeView='summary';

function projectName(id){const p=state&&state.projects?state.projects.find(function(x){return x.id===id}):null;return p?p.name:'Sem projeto'}
function serviceOptions(selected){
 let html='<option value="">Selecione</option>';
 LANG_SERVICE_TYPES.forEach(function(s){html+='<option value="'+esc(s)+'" '+(s===selected?'selected':'')+'>'+esc(s)+'</option>'});
 if(selected&&LANG_SERVICE_TYPES.indexOf(selected)<0)html+='<option value="'+esc(selected)+'" selected>'+esc(selected)+'</option>';
 return html;
}
function addMonthsISO(dateStr,n){
 if(!dateStr)return '';
 const d=new Date(dateStr+'T12:00:00');d.setMonth(d.getMonth()+n);return d.toISOString().slice(0,10);
}
function activeFinance(arr){return (arr||[]).filter(function(x){return !x.canceled})}
function isReimbursableExpense(x){return (x.type==='Reembolso')||(x.type==='Despesa'&&x.expenseClass==='Reembolso pelo cliente')}
function isPaidExpense(x){return x.type==='Reembolso'||(x.type==='Despesa'&&x.paid!==false)}
function financeKey(x){return x.projectId?('p:'+x.projectId):('c:'+x.clientId)}
function receivableSchedule(arr){
 const rows=activeFinance(arr).filter(function(x){return x.type==='A receber'}).slice().sort(function(a,b){return (a.date||'9999').localeCompare(b.date||'9999')});
 const pools={};
 activeFinance(arr).filter(function(x){return x.type==='Recebimento'}).forEach(function(x){const k=financeKey(x);pools[k]=(pools[k]||0)+Number(x.value||0)});
 return rows.map(function(x){
   const k=financeKey(x),v=Number(x.value||0),used=Math.min(v,pools[k]||0),open=Math.max(0,v-used);pools[k]=Math.max(0,(pools[k]||0)-used);
   return Object.assign({},x,{openValue:open});
 });
}
function financeSums(){
 const arr=activeFinance(state.finance),schedule=receivableSchedule(arr),now=today(),in30=new Date();in30.setDate(in30.getDate()+30);const d30=in30.toISOString().slice(0,10);
 const received=arr.filter(function(x){return x.type==='Recebimento'}).reduce(function(a,x){return a+Number(x.value||0)},0);
 const receivable=schedule.reduce(function(a,x){return a+x.openValue},0);
 const overdue=schedule.filter(function(x){return x.openValue>0&&x.date&&x.date<now}).reduce(function(a,x){return a+x.openValue},0);
 const undated=schedule.filter(function(x){return x.openValue>0&&!x.date}).reduce(function(a,x){return a+x.openValue},0);

const __baseNormalize=normalize;
normalize=function(s){
 s=__baseNormalize(s);
 s.finance=(s.finance||[]).map(function(x){
   if(typeof x.canceled!=='boolean')x.canceled=false;
   if(x.type==='Despesa'){
     if(!x.expenseClass)x.expenseClass='Custo da LANG';
     if(typeof x.paid!=='boolean')x.paid=true;
   }
   if(x.type==='Reembolso'){
     if(typeof x.paid!=='boolean')x.paid=true;
     if(!x.expenseClass)x.expenseClass='Reembolso pelo cliente';
   }
   if(typeof x.reimbursed!=='boolean')x.reimbursed=false;
   return x;
 });
 s.budgets=(s.budgets||[]).map(function(b){
   b.paymentMethod=b.paymentMethod||'À vista';
   b.installments=Math.max(1,Math.min(5,Number(b.installments||1)));
   b.firstDue=b.firstDue||'';
   return b;
 });
 return s;
};

function paymentDescription(b){
 if(b.paymentMethod==='Até 5x')return String(b.installments||2)+'x';
 if(b.paymentMethod==='50% entrada e 50% finalização')return '50% de entrada e 50% na finalização';
 return 'À vista';
}
function buildInstallments(b){
 const value=Number(b.value||0);if(value<=0)return [];
 const first=b.firstDue||'';
 if(b.paymentMethod==='Até 5x'){
   const n=Math.max(2,Math.min(5,Number(b.installments||2))),base=Math.floor((value/n)*100)/100;let used=0,out=[];
   for(let i=0;i<n;i++){const amount=i===n-1?Number((value-used).toFixed(2)):base;used+=amount;out.push({value:amount,date:addMonthsISO(first,i),label:'Parcela '+(i+1)+'/'+n})}
   return out;
 }
 if(b.paymentMethod==='50% entrada e 50% finalização'){
   const a=Number((value/2).toFixed(2)),z=Number((value-a).toFixed(2));
   return [{value:a,date:first,label:'Entrada 50%'},{value:z,date:b.deadline||'',label:'Finalização 50%'}];
 }
 return [{value:value,date:first,label:'À vista'}];
}

 if(projectTab==='tasks'){const arr=state.tasks.filter(function(t){return t.projectId===p.id||t.refId===p.id});body='<div class="card"><div class="row-between"><h3>Tarefas do projeto</h3><button class="btn primary sm" id="newProjectTask">+ Tarefa</button></div>'+(arr.length?'<div class="list" style="margin-top:10px">'+arr.map(function(t){return '<div class="list-item"><div><b>'+esc(t.title)+'</b><div class="sub">'+(t.due?fmtDate(t.due)+' · ':'')+esc(t.status||'Pendente')+'</div></div><button class="btn soft sm edit-project-task" data-id="'+t.id+'">Editar</button></div>'}).join('')+'</div>':'<div class="meta">Nenhuma tarefa vinculada.</div>')+'</div>'}
 if(projectTab==='history')body='<div class="card"><h3>Histórico do projeto</h3>'+(p.history.length?p.history.map(function(h){return '<div class="history-row"><b>'+esc(h.message)+'</b><small>'+new Date(h.at).toLocaleString('pt-BR')+'</small></div>'}).join(''):'<div class="meta">Sem registros de histórico.</div>')+'</div>';
 const buttons='<button class="btn soft" id="editProject">Editar</button><button class="btn soft" id="contractProject">Gerar / editar contrato</button>'+(pc===100&&!p.archived?'<button class="btn good" id="archiveProject">Concluir / arquivar</button>':p.archived?'<button class="btn soft" id="unarchiveProject">Reabrir projeto</button>':'');
 $('#main').innerHTML='<button class="btn soft sm" id="backProjects">← Voltar</button><div style="height:10px"></div>'+pageHead(p.name,clientName(p.clientId),buttons)+'<div class="metrics"><div class="metric"><span>Status</span><strong style="font-size:18px">'+esc(p.archived?'Concluído':p.status)+'</strong><em>'+pc+'% concluído</em></div><div class="metric"><span>Etapas concluídas</span><strong>'+p.stages.filter(function(s){return s.done}).length+'/'+p.stages.length+'</strong><em>controle do projeto</em></div><div class="metric"><span>A receber</span><strong>'+brl(receivable)+'</strong><em>vinculado ao projeto</em></div><div class="metric"><span>Recebido</span><strong>'+brl(received)+'</strong><em>vinculado ao projeto</em></div></div><div class="tabs">'+tabs.map(function(t){return '<button class="tab '+(projectTab===t[0]?'active':'')+'" data-ptab="'+t[0]+'">'+t[1]+'</button>'}).join('')+'</div>'+body;
 $('#backProjects').onclick=function(){currentProjectId=null;currentSection='projects';render()};$('#editProject').onclick=function(){projectModal(p.id)};$('#contractProject').onclick=function(){contractModal(p.id)};document.querySelectorAll('[data-ptab]').forEach(function(b){b.onclick=function(){projectTab=b.dataset.ptab;render()}});
 document.querySelectorAll('.stage-check').forEach(function(ch){ch.onchange=function(){mutate(function(d){const pp=d.projects.find(function(x){return x.id===p.id}),ss=pp.stages.find(function(x){return x.id===ch.dataset.stage});ss.done=ch.checked;addHistory(pp,(ch.checked?'Etapa concluída: ':'Etapa reaberta: ')+ss.title);if(pp.stages.length&&pp.stages.every(function(x){return x.done}))pp.status='Pronto para concluir';else if(pp.stages.some(function(x){return x.done}))pp.status='Em andamento';else pp.status='Planejamento'})}});
 if($('#archiveProject'))$('#archiveProject').onclick=function(){mutate(function(d){const pp=d.projects.find(function(x){return x.id===p.id});pp.archived=true;pp.status='Concluído';addHistory(pp,'Projeto concluído / arquivado')})};if($('#unarchiveProject'))$('#unarchiveProject').onclick=function(){mutate(function(d){const pp=d.projects.find(function(x){return x.id===p.id});pp.archived=false;pp.status='Em andamento';addHistory(pp,'Projeto reaberto')})};
 if($('#newProjectReceipt'))$('#newProjectReceipt').onclick=function(){financeModal(null,p.id,'Recebimento')};if($('#newProjectExpense'))$('#newProjectExpense').onclick=function(){financeModal(null,p.id,'Despesa')};if(projectTab==='finance')bindFinanceActions();if($('#newProjectTask'))$('#newProjectTask').onclick=function(){taskModalForProject(p.id)};document.querySelectorAll('.edit-project-task').forEach(function(b){b.onclick=function(){taskModal(b.dataset.id)}});if($('#newDocument'))$('#newDocument').onclick=function(){documentModal(p.id)};if($('#newApproval'))$('#newApproval').onclick=function(){approvalModal(p.id)};if($('#editStages'))$('#editStages').onclick=function(){stagesModal(p.id)};if($('#editNextAction'))$('#editNextAction').onclick=function(){nextActionModal(p.id)};document.querySelectorAll('.del-doc').forEach(function(b){b.onclick=function(){if(confirm('Excluir este documento?'))mutate(function(d){const pp=d.projects.find(function(x){return x.id===p.id});pp.documents=pp.documents.filter(function(x){return x.id!==b.dataset.id});addHistory(pp,'Documento removido')})}});document.querySelectorAll('.del-appr').forEach(function(b){b.onclick=function(){if(confirm('Excluir este registro de aprovação?'))mutate(function(d){const pp=d.projects.find(function(x){return x.id===p.id});pp.approvals=pp.approvals.filter(function(x){return x.id!==b.dataset.id});addHistory(pp,'Registro de aprovação removido')})}});
};

if($('#globalSearchBtn'))$('#globalSearchBtn').onclick=globalSearchModal;

$('#loginBtn').onclick=doLogin;$('#passwordInput').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});$('#logoutBtn').onclick=logout;$('#refreshBtn').onclick=async()=>{try{await load();render();toast('Dados atualizados')}catch(e){alert(e.message)}};
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstallPrompt=e;$('#installBtn').classList.remove('hidden')});$('#installBtn').onclick=async()=>{if(!deferredInstallPrompt)return;deferredInstallPrompt.prompt();try{await deferredInstallPrompt.userChoice}catch(_){}deferredInstallPrompt=null;$('#installBtn').classList.add('hidden')};window.addEventListener('appinstalled',()=>$('#installBtn').classList.add('hidden'));
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
const saved=sessionStorage.getItem('langPwd');if(saved){$('#passwordInput').value=saved;doLogin()}
})();
