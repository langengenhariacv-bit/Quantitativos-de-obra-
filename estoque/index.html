<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#171717" />
<meta name="color-scheme" content="light" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="assets/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Lang Estoque" />
<title>Lang Estoque</title>
<style>
:root{--bg:#f4f3f1;--card:#fff;--ink:#181818;--muted:#736e69;--line:#e7e2dc;--brand:#171717;--accent:#ff5a00;
  --in:#16855f;--in-bg:#e8f6f0;--out:#e2560f;--out-bg:#fff0e7;--back:#2d6bd6;--back-bg:#eaf1fd;--adj:#7a5bd1;--adj-bg:#f1edfc;
  --warn:#b8730d;--warn-bg:#fff6e3;--danger:#c23b3b;--danger-bg:#fdeeee;--shadow:0 8px 26px rgba(25,25,25,.07);--r:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}.hidden{display:none!important}
h1,h2,h3{margin:0;letter-spacing:-.02em}
/* topo */
.top{position:-webkit-sticky;position:sticky;top:0;z-index:20;background:var(--brand);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:12px}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:19px;letter-spacing:-.03em;text-decoration:none;color:#fff}
.logo .mk{width:34px;height:34px;border-radius:10px;background:var(--accent);display:grid;place-items:center;font-size:18px}
.logo small{display:block;font-size:11px;font-weight:600;color:#bdb6b0;letter-spacing:0}
.top .sp{flex:1}
.icon-btn{border:0;background:rgba(255,255,255,.1);color:#fff;width:40px;height:40px;border-radius:12px;font-size:19px;display:grid;place-items:center}
.tabs{display:none}
/* navegação inferior */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.nav a{display:grid;justify-items:center;gap:2px;text-decoration:none;color:var(--muted);font-size:11px;font-weight:700;padding:4px 0;border-radius:12px}
.nav a .i{font-size:21px;line-height:1.1;filter:grayscale(1);opacity:.7}
.nav a.on{color:var(--ink)}.nav a.on .i{filter:none;opacity:1}
.nav .fab{align-self:center;justify-self:center;width:56px;height:56px;margin-top:-26px;border-radius:50%;border:4px solid var(--bg);background:var(--accent);color:#fff;font-size:30px;font-weight:400;display:grid;place-items:center;box-shadow:0 8px 20px rgba(255,90,0,.35)}
main{max-width:1120px;margin:0 auto;padding:16px 16px calc(100px + env(safe-area-inset-bottom))}
@media(min-width:900px){
  .nav{display:none}
  .tabs{display:flex;gap:4px;margin-left:18px}
  .tabs a{color:#cfc9c3;text-decoration:none;font-weight:750;padding:9px 14px;border-radius:11px;font-size:14px}
  .tabs a.on{background:rgba(255,255,255,.12);color:#fff}
  .tabs .new{background:var(--accent);color:#fff;margin-left:8px}
  main{padding-bottom:40px}
}
/* blocos */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;border:1px solid rgba(0,0,0,.03)}
.sec{margin:22px 0 10px;display:flex;align-items:center;gap:10px}
.sec h2{font-size:17px}.sec .sp{flex:1}.sec a,.link{color:var(--accent);font-weight:800;font-size:13px;text-decoration:none;background:none;border:0;padding:0}
.muted{color:var(--muted)}.small{font-size:12.5px}.b{font-weight:800}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
@media(min-width:700px){.g4{grid-template-columns:repeat(4,1fr)}}
.g4{grid-template-columns:repeat(2,1fr)}
/* ações rápidas */
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.qa{border:0;border-radius:18px;padding:16px 10px;display:grid;justify-items:center;gap:6px;font-weight:850;font-size:14px;color:#fff;box-shadow:var(--shadow);transition:transform .1s}
.qa:active{transform:scale(.97)}.qa .i{font-size:28px;width:52px;height:52px;border-radius:16px;background:rgba(255,255,255,.2);display:grid;place-items:center}
.qa small{font-weight:600;opacity:.85;font-size:11.5px}
.qa.in{background:linear-gradient(150deg,#1b9a6e,#127252)}.qa.out{background:linear-gradient(150deg,#ff6f1f,#e04d08)}.qa.back{background:linear-gradient(150deg,#3b7be6,#2459b8)}
/* kpi */
.kpi{padding:14px 15px}.kpi .v{font-size:25px;font-weight:900;letter-spacing:-.03em;margin-top:4px}.kpi .l{font-size:12px;color:var(--muted);font-weight:700}
.kpi .e{font-size:20px;float:right}
.kpi.alert{background:var(--danger-bg);border-color:#f6d2d2}.kpi.alert .v{color:var(--danger)}
/* gráfico barras */
.bars{display:grid;gap:11px}
.bar-row{display:grid;grid-template-columns:minmax(90px,38%) 1fr auto;align-items:center;gap:10px;font-size:13px}
.bar-row .n{font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:7px}
.bar-track{height:14px;background:#f1eeea;border-radius:8px;overflow:hidden}.bar-fill{height:100%;border-radius:8px;min-width:3px}
.bar-row .val{font-weight:800;font-size:12.5px;text-align:right;min-width:60px}
.dot{width:11px;height:11px;border-radius:50%;flex:none;display:inline-block}
.cols{display:flex;align-items:flex-end;gap:5px;height:120px;padding-top:6px}
.cols .c{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;height:100%;position:relative}
.cols .c i{display:block;border-radius:4px 4px 2px 2px;min-height:0}
.cols-x{display:flex;gap:5px;margin-top:6px}.cols-x span{flex:1;text-align:center;font-size:10px;color:var(--muted)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);font-weight:700;margin-top:10px}.legend span{display:flex;align-items:center;gap:6px}
/* listas */
.list{display:grid;gap:8px;grid-template-columns:minmax(0,1fr)}.grid>*,.list>*{min-width:0}
.row{display:flex;align-items:center;gap:12px;background:#fff;border-radius:15px;padding:12px 13px;box-shadow:var(--shadow);border:1px solid rgba(0,0,0,.03);text-decoration:none;color:inherit;width:100%;text-align:left}
button.row{border:1px solid rgba(0,0,0,.03)}
.row .ic{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-size:22px;flex:none;background:#f3f0ec}
.row .tx{flex:1;min-width:0}.row .t{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row .s{font-size:12.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r{text-align:right;flex:none}.row .r .q{font-weight:900;font-size:16px}.row .r .u{font-size:11.5px;color:var(--muted);font-weight:700}
.ic.in{background:var(--in-bg)}.ic.out{background:var(--out-bg)}.ic.back{background:var(--back-bg)}.ic.adj{background:var(--adj-bg)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:850;padding:3px 8px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--in-bg);color:var(--in)}.pill.low{background:var(--warn-bg);color:var(--warn)}.pill.zero{background:var(--danger-bg);color:var(--danger)}
.pill.in{background:var(--in-bg);color:var(--in)}.pill.out{background:var(--out-bg);color:var(--out)}.pill.back{background:var(--back-bg);color:var(--back)}.pill.adj{background:var(--adj-bg);color:var(--adj)}
.pill.none{background:#efebe7;color:#8a837d}.tile .ts.none{color:#a39c96}
.pill.gray{background:#efebe7;color:#615b56}
.lvl{height:6px;background:#f1eeea;border-radius:5px;overflow:hidden;margin-top:7px}.lvl i{display:block;height:100%;border-radius:5px}
/* obras */
.obra{position:relative;overflow:hidden;text-decoration:none;color:inherit;display:block;padding:16px 16px 14px 20px}
.obra:before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--c)}
.obra h3{font-size:16.5px}.obra .meta{display:flex;gap:16px;margin-top:12px}.obra .meta div{font-size:12px;color:var(--muted);font-weight:700}.obra .meta b{display:block;font-size:17px;color:var(--ink);font-weight:900}
.hero{border-radius:22px;padding:18px;color:#fff;background:var(--c,#171717);position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero h1{font-size:23px}.hero .sub{opacity:.85;font-size:13px;margin-top:4px}
.hero .meta{display:flex;flex-wrap:wrap;gap:20px;margin-top:16px}.hero .meta div{font-size:12px;opacity:.9;font-weight:700}.hero .meta b{display:block;font-size:20px;font-weight:900}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
/* filtros */
.search{display:flex;gap:8px;margin-bottom:10px}
.search input,.search select{flex:1;border:1px solid var(--line);background:#fff;border-radius:13px;padding:12px 14px;outline:none;min-width:0}
.search select{flex:0 1 auto}
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font-size:13px;font-weight:750;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip.obra-chip.on{background:var(--c);border-color:var(--c)}
/* botões */
.btn{border:0;border-radius:13px;padding:11px 16px;font-weight:850;display:inline-flex;align-items:center;justify-content:center;gap:7px;text-decoration:none;font-size:14px}
.btn.primary{background:var(--accent);color:#fff}.btn.dark{background:var(--ink);color:#fff}.btn.soft{background:#f1eeea;color:var(--ink)}
.btn.white{background:rgba(255,255,255,.95);color:var(--ink)}.btn.ghost{background:rgba(255,255,255,.18);color:#fff}
.btn.danger{background:var(--danger-bg);color:var(--danger)}.btn.full{width:100%}.btn.lg{padding:15px 18px;font-size:16px;border-radius:15px}
.btn:disabled{opacity:.45;cursor:not-allowed}
/* vazio */
.empty{text-align:center;padding:34px 18px}.empty .i{font-size:46px}.empty h3{margin:10px 0 6px}.empty p{color:var(--muted);margin:0 0 16px;line-height:1.5}
/* folha (modal) */
.sheet-bg{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(15,15,15,.48);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--bg);width:100%;max-width:620px;max-height:94vh;border-radius:24px 24px 0 0;display:flex;flex-direction:column;animation:up .2s ease-out}
@media(min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:24px;max-height:90vh}}
.sheet-h{display:flex;align-items:center;gap:10px;padding:16px 16px 10px}.sheet-h h2{flex:1;font-size:19px}
.sheet-h .x{border:0;background:#e9e5e0;width:36px;height:36px;border-radius:50%;font-size:17px}
.sheet-b{overflow-y:auto;padding:4px 16px 16px;flex:1}
.sheet-f{padding:12px 16px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#fff;border-radius:0 0 0 0}
@media(min-width:700px){.sheet-f{border-radius:0 0 24px 24px}}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}@keyframes fade{from{opacity:0}}
/* formulário */
.f{display:grid;gap:6px;margin-bottom:13px}.f label{font-size:12.5px;font-weight:800;color:#4d4843}
.f input,.f select,.f textarea{width:100%;border:1px solid #dcd6d0;border-radius:12px;padding:12px 13px;background:#fff;outline:none}
.f input:focus,.f select:focus,.f textarea:focus{border-color:#ff9a5f;box-shadow:0 0 0 3px rgba(255,90,0,.12)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.seg button{border:2px solid var(--line);background:#fff;border-radius:15px;padding:11px 4px;font-weight:850;font-size:13px;display:grid;justify-items:center;gap:3px}
.seg button .i{font-size:22px}
.seg .in.on{border-color:var(--in);background:var(--in-bg);color:var(--in)}.seg .out.on{border-color:var(--out);background:var(--out-bg);color:var(--out)}.seg .back.on{border-color:var(--back);background:var(--back-bg);color:var(--back)}
.item{background:#fff;border-radius:15px;padding:11px 12px;margin-bottom:8px;border:1px solid var(--line)}
.item .top2{display:flex;align-items:center;gap:10px}.item .nm{flex:1;min-width:0;font-weight:800}.item .nm small{display:block;font-weight:600;color:var(--muted);font-size:12px}
.item .rm{border:0;background:none;font-size:18px;color:#a8a19b;padding:4px}
.qty{display:flex;align-items:center;gap:6px;margin-top:9px}
.qty button{width:42px;height:42px;border-radius:12px;border:0;background:#f1eeea;font-size:22px;font-weight:700;flex:none}
.qty input{flex:1;min-width:0;text-align:center;font-size:19px;font-weight:900;border:1px solid #dcd6d0;border-radius:12px;padding:8px 6px;outline:none}
.qty .un{font-weight:800;color:var(--muted);font-size:13px;min-width:44px}
.price{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12.5px;color:var(--muted);font-weight:700}.price input{flex:1;border:1px solid #dcd6d0;border-radius:10px;padding:8px 10px;outline:none;min-width:0}
.warnbox{background:var(--warn-bg);color:#8a560a;border-radius:12px;padding:9px 11px;font-size:12.5px;font-weight:700;margin-top:8px}
.errbox{background:var(--danger-bg);color:var(--danger);border-radius:12px;padding:9px 11px;font-size:12.5px;font-weight:700;margin-top:8px}
.add-item{width:100%;border:2px dashed #d3ccc5;background:transparent;border-radius:15px;padding:13px;font-weight:850;color:#5a544f}
.picker{display:grid;gap:7px;max-height:46vh;overflow-y:auto;margin-top:8px}
.colors{display:flex;flex-wrap:wrap;gap:9px}.colors button{width:38px;height:38px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px var(--line)}.colors button.on{box-shadow:0 0 0 3px var(--ink)}
.stepper-label{font-size:12.5px;font-weight:800;color:#4d4843;margin:4px 0 8px;display:flex;align-items:center;gap:8px}
.stepper-label .n{width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:12px}
/* tabela */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}.tbl th{text-align:left;font-size:11.5px;color:var(--muted);font-weight:800;padding:8px 6px;border-bottom:1px solid var(--line)}
.tbl td{padding:10px 6px;border-bottom:1px solid #f1ede9;vertical-align:middle}.tbl td.n,.tbl th.n{text-align:right;white-space:nowrap}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#171717;color:#fff;padding:12px 18px;border-radius:14px;font-weight:750;font-size:14px;z-index:90;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:92vw;animation:up .2s}
.big-saldo{font-size:44px;font-weight:950;letter-spacing:-.04em;line-height:1}
.mt{margin-top:12px}.mt2{margin-top:20px}
.mi{width:1.4em;height:1.4em;border-radius:6px;object-fit:cover;vertical-align:middle}
.ic,.ti,.kic{overflow:hidden}.ic .mi,.ti .mi,.kic .mi{width:100%;height:100%;border-radius:0}
body.movmode .nav{display:none}body.movmode main{padding-bottom:calc(170px + env(safe-area-inset-bottom))}
.seg.big button{padding:14px 4px;font-size:15px}.seg.big .i{font-size:28px}
.obras-strip{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px;margin-bottom:6px;scrollbar-width:none}.obras-strip::-webkit-scrollbar{display:none}
.oc{flex:none;min-width:132px;max-width:190px;border:2px solid var(--line);border-left:8px solid var(--c);background:#fff;border-radius:16px;padding:12px 26px 12px 12px;text-align:left;font-weight:850;font-size:14px;position:relative;line-height:1.2}
.oc small{display:block;font-weight:600;color:var(--muted);font-size:11.5px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.oc.on{background:var(--c);color:#fff;border-color:var(--c);box-shadow:0 6px 16px rgba(0,0,0,.18)}.oc.on small{color:rgba(255,255,255,.85)}
.oc.on:after{content:"✓";position:absolute;top:9px;right:10px;font-size:16px;font-weight:900}
.oc.new{border-style:dashed;border-left-width:2px;color:var(--muted);background:transparent}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media(min-width:560px){.tiles{grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:12px}}
.tile{position:relative;border:2.5px solid transparent;background:#fff;border-radius:18px;padding:12px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:var(--shadow);min-height:136px;transition:transform .08s}
.tile:active{transform:scale(.95)}
.tile .ti{width:60px;height:60px;border-radius:17px;background:#f5f2ee;display:grid;place-items:center;font-size:35px}
.tile .tn{font-weight:800;font-size:12.5px;line-height:1.25;text-align:center;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .ts{font-size:11px;font-weight:800;color:var(--muted);margin-top:auto}.tile .ts.low{color:var(--warn)}.tile .ts.zero{color:var(--danger)}
.tile.sel{border-color:var(--tc);background:#fffaf6}.tile.dim{opacity:.45}
.tile .badge{position:absolute;top:-8px;right:-4px;background:var(--tc);color:#fff;font-weight:900;font-size:12px;border-radius:999px;padding:4px 9px;box-shadow:0 3px 8px rgba(0,0,0,.22);max-width:95%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mv-bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);box-shadow:0 -8px 24px rgba(0,0,0,.08);padding:10px 14px calc(12px + env(safe-area-inset-bottom))}
.mv-bar-in{max-width:1120px;margin:0 auto}
.sel-strip{display:flex;gap:6px;overflow-x:auto;margin-bottom:9px;scrollbar-width:none}.sel-strip::-webkit-scrollbar{display:none}
.sel-chip{flex:none;display:flex;align-items:center;gap:6px;border:0;background:#f1eeea;border-radius:999px;padding:4px 11px 4px 4px;font-size:13px;font-weight:800}
.kic{width:40px;height:40px;border-radius:12px;background:#f5f2ee;display:grid;place-items:center;font-size:25px;flex:none}
.kinfo{text-align:center;color:var(--muted);font-size:13.5px}
.kdisp{text-align:center;font-size:54px;font-weight:950;letter-spacing:-.03em;line-height:1.1;padding:4px 0 2px}.kun{font-size:20px;color:var(--muted);font-weight:800;letter-spacing:0}
.kquick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.kquick button{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:10px 0;font-weight:850;font-size:15px}
.kpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpad button{border:0;background:#fff;border-radius:14px;padding:13px 0;font-size:25px;font-weight:800;box-shadow:0 2px 0 #e1dbd4}.kpad button:active{background:#ece7e2}
.icons{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.icons button{width:42px;height:42px;border-radius:11px;border:1.5px solid var(--line);background:#fff;font-size:22px;padding:0}.icons button.on{border-color:var(--accent);background:var(--out-bg);box-shadow:0 0 0 2px var(--accent)}
body.locked .top,body.locked main,body.locked .nav{display:none!important}#lock{display:none}body.locked #lock{display:block}
.lock{min-height:100vh;background:radial-gradient(circle at 85% 8%,rgba(255,90,0,.28),transparent 36%),linear-gradient(160deg,#121212,#272727);color:#fff;padding:calc(30px + env(safe-area-inset-top)) 18px 40px}
.lock-h{display:flex;align-items:center;gap:13px;max-width:760px;margin:0 auto 26px}.lock-h .mk{width:50px;height:50px;border-radius:15px;background:var(--accent);display:grid;place-items:center;font-size:26px;flex:none}
.lock-h b{font-size:23px;display:block}.lock-h small{color:#c9c2bc;font-size:14px}
.people{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}
.person{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:22px;padding:18px 8px 15px;color:#fff;display:flex;flex-direction:column;align-items:center;font-weight:800;font-size:15px}
.person>*+*{margin-top:9px}.person small{color:#ff9a5f;font-size:11.5px;font-weight:800;margin-top:2px}.person:active{background:rgba(255,255,255,.16)}
.av{border-radius:50%;object-fit:cover;display:inline-grid;place-items:center;color:#fff;font-weight:900;flex:none;overflow:hidden;vertical-align:middle}
.pinbox{max-width:340px;margin:0 auto;text-align:center}.pinbox h2{font-size:22px}
.pdots{display:flex;justify-content:center;margin:20px 0 8px}.pdots i{width:18px;height:18px;border-radius:50%;border:2px solid #fff;margin:0 8px}.pdots i.on{background:#fff}
.pinbox .kpad button{background:rgba(255,255,255,.1);color:#fff;box-shadow:none;font-size:28px;padding:16px 0}.pinbox .kpad button:active{background:rgba(255,255,255,.25)}
.shake{animation:shake .35s}@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.user-chip{display:flex;align-items:center;border:0;background:rgba(255,255,255,.1);color:#fff;border-radius:999px;padding:4px 12px 4px 4px;font-weight:800;font-size:13px;margin-right:8px}.user-chip span{margin-left:8px}
.cam{position:relative;width:280px;height:280px;margin:0 auto;border-radius:26px;overflow:hidden;background:#111}.cam video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.cd{position:absolute;top:0;left:0;right:0;bottom:0;display:grid;place-items:center;font-size:84px;font-weight:950;color:#fff;text-shadow:0 4px 20px rgba(0,0,0,.55)}
.chk{display:flex;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;cursor:pointer}.chk input{width:22px;height:22px;margin:2px 12px 0 0;flex:none;accent-color:var(--accent)}
.selfie{width:84px;height:84px;border-radius:16px;object-fit:cover;flex:none}
/* ===== Aparelhos antigos sem CSS grid (iPad com iOS 9): layout alternativo ===== */
.nogrid *{gap:0!important;row-gap:0!important;column-gap:0!important}
.nogrid .top{padding:10px 16px}.nogrid main{padding:16px 16px 100px}.nogrid body.movmode main{padding-bottom:170px}
.nogrid .nav,.nogrid .mv-bar{padding-bottom:8px}.nogrid .sheet-f{padding:12px 16px 14px}.nogrid .lock{padding:30px 18px 40px}
.nogrid .logo .mk,.nogrid .row .ic,.nogrid .stepper-label .n,.nogrid .tile .ti,.nogrid .kic,.nogrid .lock-h .mk,.nogrid .cd,.nogrid .qa .i{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center}
.nogrid .icon-btn{display:block;text-align:center;line-height:40px;padding:0}
.nogrid .nav{display:-webkit-flex;display:flex}.nogrid .nav>a{-webkit-flex:1;flex:1;display:block;text-align:center}.nogrid .nav a .i{display:block}
.nogrid .nav .fab{-webkit-flex:none;flex:none;display:block;text-align:center;line-height:48px;padding:0;margin:-26px 6px 0}
.nogrid .av{display:inline-block;text-align:center}
.nogrid .grid,.nogrid .quick,.nogrid .seg,.nogrid .tiles,.nogrid .kquick,.nogrid .kpad,.nogrid .f2{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;margin:-5px -5px 9px}
.nogrid .grid>*,.nogrid .quick>*,.nogrid .seg>*,.nogrid .tiles>*,.nogrid .kquick>*,.nogrid .kpad>*,.nogrid .f2>*{margin:5px;width:calc(100% - 10px)}
.nogrid .quick>*,.nogrid .seg>*,.nogrid .kpad>*,.nogrid .tiles>*{width:calc(33.333% - 10px)}
.nogrid .g2>*,.nogrid .g3>*,.nogrid .g4>*,.nogrid .f2>*{width:calc(50% - 10px)}.nogrid .kquick>*{width:calc(25% - 10px)}
@media(min-width:560px){.nogrid .tiles>*{width:calc(20% - 10px)}.nogrid .g4>*{width:calc(25% - 10px)}}
.nogrid .people{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap}.nogrid .people>*{margin:7px;width:calc(33.333% - 14px)}
.nogrid .list,.nogrid .bars,.nogrid .picker,.nogrid .f{display:block}.nogrid .list>*,.nogrid .bars>*,.nogrid .picker>*{margin-bottom:9px}.nogrid .f>label{display:block;margin-bottom:6px}
.nogrid .bar-row{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center}.nogrid .bar-row .n{width:38%;-webkit-flex:none;flex:none}.nogrid .bar-row .bar-track{display:block;-webkit-flex:1;flex:1;margin:0 10px}
/* botões não podem ser "flex" no Safari antigo: conteúdo em bloco, centralizado */
.nogrid .qa,.nogrid .seg button,.nogrid .tile,.nogrid .person{display:block;text-align:center}
.nogrid .qa .i,.nogrid .tile .ti{margin:0 auto 6px}.nogrid .qa small,.nogrid .seg button .i,.nogrid .person>span,.nogrid .person small,.nogrid .tile .tn,.nogrid .tile .ts{display:block}
.nogrid .person>span.av{display:inline-block;margin-top:0}.nogrid .tile .tn{margin:0 0 6px}.nogrid .person>*+*{margin-top:9px}
.nogrid button.row{display:block;position:relative;text-align:left;padding-right:96px;min-height:68px}
.nogrid button.row>.ic,.nogrid button.row>.av{float:left;margin-right:12px}.nogrid button.row>.tx{display:block;overflow:hidden;padding-top:3px}
.nogrid button.row>.r,.nogrid button.row>.muted{position:absolute;right:13px;top:50%;-webkit-transform:translateY(-50%);transform:translateY(-50%)}
.nogrid .sel-chip{display:inline-block}.nogrid .sel-chip .kic{display:inline-block;vertical-align:middle;margin-right:6px;text-align:center}
/* espaços entre itens (o Safari antigo não entende "gap" no flex) */
.nogrid .logo>*+*,.nogrid .row>*+*,.nogrid .sec>*+*,.nogrid .search>*+*,.nogrid .sheet-h>*+*,.nogrid .qty>*+*,.nogrid .price>*+*,.nogrid .item .top2>*+*,.nogrid .stepper-label>*+*,.nogrid .top>*+*,.nogrid .lock-h>*+*,.nogrid .legend>*+*,.nogrid .obra .meta>*+*,.nogrid .legend span>*+*{margin-left:10px}
.nogrid button.row>*+*{margin-left:0}
.nogrid .chips>*,.nogrid .obras-strip>*,.nogrid .sel-strip>*,.nogrid .actions>*,.nogrid .colors>*,.nogrid .icons>*,.nogrid .hero .meta>*{margin:0 8px 8px 0}
.nogrid [style*="gap"]>*+*{margin-left:8px}.nogrid .cols>*+*,.nogrid .cols-x>*+*{margin-left:5px}
/* impressão */
#print{display:none}
@media print{
  body>*:not(#print){display:none!important}#print{display:block!important;color:#000;font-size:12px}
  @page{margin:14mm}
  #print h1{font-size:20px}#print table{width:100%;border-collapse:collapse;margin-top:10px}#print th,#print td{border:1px solid #999;padding:6px;text-align:left}#print td.n,#print th.n{text-align:right}
  #print .ph{display:flex;justify-content:space-between;border-bottom:3px solid #ff5a00;padding-bottom:8px;margin-bottom:10px}
  #print .sig{display:flex;gap:40px;margin-top:60px}#print .sig div{flex:1;border-top:1px solid #000;text-align:center;padding-top:5px}
}
</style>
