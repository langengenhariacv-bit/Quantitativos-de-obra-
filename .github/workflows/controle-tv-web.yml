name: Site (Controle TV + Visita Técnica + Habite-se + Estoque)

on:
  push:
    branches: [main]
    paths:
      - 'controle-tv/**'
      - 'vistoria/**'
      - 'habite-se/**'
      - 'estoque/**'
      - 'tools/estoque-legacy/**'
      - '.github/workflows/controle-tv-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Lang Estoque: gera a versão para aparelhos antigos (iPad com iOS 9) a partir de estoque/app.js
      - name: Gerar estoque/app-legacy.js
        run: cd tools/estoque-legacy && npm ci --no-audit --no-fund && node build.js

      # A tela é a mesma do app Android; no navegador a ponte tv-web.js substitui a nativa.
      - name: Montar site
        run: |
          mkdir -p _site
          cp controle-tv/android/app/src/main/assets/index.html controle-tv/android/app/src/main/assets/pairing.json _site/
          cp controle-tv/web/* _site/
          # App de visita técnica em /vistoria/
          cp -r vistoria _site/vistoria
          # App de vistoria para habite-se do CBMSC em /habite-se/
          cp -r habite-se _site/habite-se
          # Controle de estoque de materiais por obra em /estoque/
          cp -r estoque _site/estoque

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
